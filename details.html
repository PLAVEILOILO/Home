<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asterum | Event Details</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --text: #1e1530;
    --theme-purple: #a87fe8; --accent: #6c5ce7; --border: rgba(180,160,220,0.2);
  }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
  .container { width: min(1000px, 100%); background: var(--surface); padding: 40px; border-radius: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); box-sizing: border-box; }
  
  /* Header Layout */
  .header-flex { display: flex; align-items: center; gap: 25px; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 30px; }
  .header-flex.centered { flex-direction: column; text-align: center; justify-content: center; }
  .header-flex.centered .quick-meta, .header-flex.centered .dress-container { justify-content: center; }
  
  .event-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--theme-purple); flex-shrink: 0; }
  .header-text h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 4vw, 42px); margin: 5px 0; }
  
  .back-btn { text-decoration: none; color: var(--theme-purple); font-weight: 600; font-size: 14px; margin-bottom: 20px; display: inline-block; transition: opacity 0.2s; }
  .back-btn:hover { opacity: 0.7; }
  
  .quick-meta { display: flex; flex-wrap: wrap; gap: 15px; font-size: 14px; opacity: 0.8; margin-bottom: 15px; }

  /* Dress Code Chips in Header */
  .dress-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .dress-chip { background: #f0f0f0; color: #666; padding: 4px 12px; border-radius: 100px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid var(--border); }

  /* Adaptive Content Layout */
  .main-content { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; }
  .main-content.centered { grid-template-columns: 1fr; max-width: 800px; margin: 0 auto; }
  .centered .description { text-align: center; }

  /* Gallery */
  .gallery-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 30px; }
 /* Professional Mosaic Grid */
.gallery-grid { 
  display: grid; 
  /* This creates as many columns as fit, at least 250px each */
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
  gap: 16px; 
  margin-top: 20px; 
}

.gallery-grid img { 
  width: 100%; 
  aspect-ratio: 1 / 1; /* Forces a perfect square */
  object-fit: cover;   /* Magic bit: fills the square without stretching */
  border-radius: 20px; 
  border: 1px solid var(--border); 
  transition: transform 0.3s ease, box-shadow 0.3s ease; 
}

.gallery-grid img:hover { 
  transform: translateY(-5px); 
  box-shadow: 0 10px 20px rgba(168, 127, 232, 0.15); 
}
  .description { line-height: 1.8; font-size: 17px; white-space: pre-line; margin-bottom: 30px; }
  
  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; gap: 20px; }
  .rsvp-btn { display: block; text-align: center; background: var(--accent); color: white; padding: 18px; border-radius: 16px; text-decoration: none; font-weight: 700; transition: transform 0.2s; }
  .rsvp-btn:hover { transform: scale(1.02); }

  /* Video */
  .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 24px; margin-top: 40px; border: 1px solid var(--border); }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

  @media (max-width: 768px) {
    .main-content { grid-template-columns: 1fr !important; }
    .header-flex { flex-direction: column; text-align: center; }
    .header-flex .quick-meta, .header-flex .dress-container { justify-content: center; }
    .container { padding: 20px; }
  }
</style>
</head>
<body>

<div id="details-root"></div>

<script>
  const SPREADSHEET_ID = '2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW';
  const TIMELINE_GID = '1296117535';
  const DETAILS_GID = '1063823403'; 
  const BACK_LINK = 'asterum-timeline.html';

  async function fetchCSV(gid) {
    const response = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${gid}&single=true&output=csv`);
    const csv = await response.text();
    return csv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
  }

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    return min === max ? `₱${Number(min).toLocaleString()}` : `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    if (!eventId) return;

    try {
      const [timelineRows, detailRows] = await Promise.all([fetchCSV(TIMELINE_GID), fetchCSV(DETAILS_GID)]);
      const tData = timelineRows.find(r => r[13] === eventId); 
      const dData = detailRows.find(r => r[0] === eventId);

      if (!tData) {
        document.body.innerHTML = "<div style='text-align:center; padding:50px;'>Event not found.</div>";
        return;
      }

      const title = tData[3], timelineImg = tData[7], dress = tData[11];
      const rsvp = dData ? dData[2] : "";
      const hasSidebar = !!rsvp; // Only has sidebar if RSVP link exists

      document.getElementById('details-root').innerHTML = `
        <div class="container">
          <a href="${BACK_LINK}" class="back-btn">← Back to Timeline</a>
          
          <div class="header-flex ${!hasSidebar ? 'centered' : ''}">
            <img src="${timelineImg}" class="event-logo">
            <div class="header-text">
                <span style="background:#f3edff; color:var(--theme-purple); padding:3px 8px; border-radius:5px; font-size:10px; font-weight:700; text-transform:uppercase;">${tData[8]}</span>
                <h1>${title}</h1>
                <div class="quick-meta">
                    <span>📅 ${tData[0]} ${new Date(2000, tData[1]-1).toLocaleString('default', {month:'long'})} ${tData[2]}</span>
                    <span>⏰ ${tData[4]}</span>
                    <span>📍 ${tData[6]}</span>
                    <span>🎟️ ${formatPrice(tData[9], tData[10])}</span>
                </div>
                ${dress ? `
                  <div class="dress-container">
                    ${dress.split(',').map(d => `<span class="dress-chip">👗 ${d.trim()}</span>`).join('')}
                  </div>` : ''}
            </div>
          </div>

          <div class="main-content ${!hasSidebar ? 'centered' : ''}">
            <div class="content-body">
              ${dData && dData[1] ? `<div class="description">${dData[1]}</div>` : ''}
              
              ${dData && dData[3] ? `
                <div class="gallery-section">
                  <h3 style="font-size:12px; text-transform:uppercase; color:var(--theme-purple); letter-spacing:1px;">Event Highlights</h3>
                  <div class="gallery-grid">
                    ${dData[3].split(',').map(img => `<img src="${img.trim()}" alt="Gallery highlight">`).join('')}
                  </div>
                </div>` : ''}

              ${dData && dData[4] ? `<div class="video-container"><iframe src="${dData[4]}" allowfullscreen></iframe></div>` : ''}
            </div>

            ${hasSidebar ? `
              <div class="sidebar">
                <a href="${rsvp}" class="rsvp-btn" target="_blank">RSVP / REGISTER</a>
              </div>` : ''}
          </div>
        </div>
      `;

    } catch (err) {
      console.error(err);
      document.getElementById('details-root').innerHTML = "Error loading event details.";
    }
  }
  init();
</script>
</body>
</html>
