<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asterum | Event Details</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #faf7ff; --surface: #ffffff; --text: #1e1530; --theme-purple: #a87fe8; --accent: #6c5ce7; --border: rgba(180,160,220,0.2); }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
  .container { width: min(1000px, 100%); background: var(--surface); padding: 40px; border-radius: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); box-sizing: border-box; }
  
  .header-flex { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 30px; }
  .header-flex.is-centered { flex-direction: column; text-align: center; }
  
  .logo-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .event-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--theme-purple); }
  
  .header-text h1 { font-family: 'Playfair Display', serif; font-size: clamp(24px, 4vw, 36px); margin: 5px 0; line-height: 1.2; }
  .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; justify-content: inherit; }
  .member-badge { padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }

  .main-content { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; }
  .main-content.is-centered { grid-template-columns: 1fr; text-align: center; }

  .description { line-height: 1.8; font-size: 17px; white-space: pre-line; margin-bottom: 30px; }
  
  /* Highlights Logic */
  .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
  .gallery-item { position: relative; aspect-ratio: 3/2; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
  .more-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }

  .rsvp-btn { display: block; text-align: center; background: var(--accent); color: white; padding: 18px; border-radius: 16px; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div id="details-root"></div>

<script>
  const SPREADSHEET_ID = '2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW';
  const TIMELINE_GID = '1296117535';
  const DETAILS_GID = '1063823403';

  const memberStyles = {
    "Yejun": { bg: "#eef5ff", text: "#4B92FF" },
    "Noah": { bg: "#f5f0ff", text: "#A076FF" },
    "Bamby": { bg: "#fff0f6", text: "#FF7EB3" },
    "Eunho": { bg: "#fff0f0", text: "#FF4D4D" },
    "Hamin": { bg: "#e9f9ee", text: "#2ECC71" },
    "PLAVE": { bg: "#7a4ed9", text: "#ffffff" }
  };

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    return min === max ? `₱${Number(min).toLocaleString()}` : `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    const response = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${TIMELINE_GID}&single=true&output=csv`);
    const csv = await response.text();
    const rows = csv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
    const tData = rows.find(r => r[12] === eventId);
    
    const dResp = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${DETAILS_GID}&single=true&output=csv`);
    const dCsv = await dResp.text();
    const dRows = dCsv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
    const dData = dRows.find(r => r[0] === eventId);

    const hasSidebar = !!(dData && dData[2]);
    const imgs = tData[6].split(',');
    const highlights = dData && dData[3] ? dData[3].split(',') : [];

    document.getElementById('details-root').innerHTML = `
      <div class="container">
        <div class="header-flex ${!hasSidebar ? 'is-centered' : ''}">
          <div class="logo-group">${imgs.map(i => `<img src="${i.trim()}" class="event-logo">`).join('')}</div>
          <div class="header-text">
            <div class="tag-container">${(tData[13]||"").split(',').map(m => {
              const s = memberStyles[m.trim()] || memberStyles["PLAVE"];
              return `<span class="member-badge" style="background:${s.bg}; color:${s.text}">${m.trim()}</span>`
            }).join('')}</div>
            ${tData[2].split(',').map(t => `<h1>${t.trim()}</h1>`).join('')}
            <div class="quick-meta" style="justify-content: inherit;">
              <span>📅 ${new Date(tData[0]).toDateString()}</span>
              <span>🎟️ ${formatPrice(tData[8], tData[9])}</span>
            </div>
          </div>
        </div>

        <div class="main-content ${!hasSidebar ? 'is-centered' : ''}">
          <div class="content-body">
            <div class="description">${dData ? dData[1] : ''}</div>
            ${highlights.length ? `
              <div class="gallery-grid">
                ${highlights.slice(0, 4).map((img, i) => `
                  <div class="gallery-item">
                    <img src="${img.trim()}">
                    ${(i === 3 && highlights.length > 4) ? `<div class="more-overlay">+${highlights.length - 4} More</div>` : ''}
                  </div>
                `).join('')}
              </div>` : ''}
          </div>
          ${hasSidebar ? `<div class="sidebar"><a href="${dData[2]}" class="rsvp-btn">RSVP NOW</a></div>` : ''}
        </div>
      </div>
    `;
  }
  init();
</script>
</body>
</html>
