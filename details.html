<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asterum | Event Details</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --text: #1e1530;
    --theme-purple: #a87fe8; --accent: #6c5ce7; --border: rgba(180,160,220,0.2);
  }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
  .container { width: min(1000px, 100%); background: var(--surface); padding: 40px; border-radius: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
  
  .back-btn { text-decoration: none; color: var(--theme-purple); font-weight: 600; font-size: 14px; margin-bottom: 20px; display: inline-block; }
  
  .header-section { border-bottom: 1px solid var(--border); margin-bottom: 30px; padding-bottom: 20px; }
  .cat-tag { background: #f3edff; color: var(--theme-purple); padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 48px); margin: 15px 0 5px 0; }
  
  .quick-meta { display: flex; flex-wrap: wrap; gap: 20px; font-size: 15px; opacity: 0.8; margin-top: 10px; }

  /* Main Featured Image (from Timeline) */
  .featured-banner { width: 100%; border-radius: 24px; margin-bottom: 30px; overflow: hidden; border: 1px solid var(--border); }
  .featured-banner img { width: 100%; height: auto; max-height: 500px; object-fit: cover; display: block; }

  .main-content { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; }
  
  /* Gallery Carousel (from EventDetails) */
  .gallery-section { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 30px; }
  .carousel-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; scrollbar-width: none; border-radius: 20px; margin-top: 15px; }
  .carousel-track::-webkit-scrollbar { display: none; }
  .carousel-item { flex: 0 0 100%; scroll-snap-align: start; }
  .carousel-item img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 20px; display: block; }

  .description { line-height: 1.8; font-size: 17px; white-space: pre-line; }
  .sidebar { display: flex; flex-direction: column; gap: 20px; }
  
  .info-box { background: #fcfaff; padding: 25px; border-radius: 24px; border: 1px solid var(--border); }
  .info-box h3 { margin: 0 0 12px 0; font-size: 13px; text-transform: uppercase; color: var(--theme-purple); letter-spacing: 1px; }
  
  .dress-chip { display: inline-block; background: #eee; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin: 2px; }
  .rsvp-btn { display: block; text-align: center; background: var(--accent); color: white; padding: 18px; border-radius: 16px; text-decoration: none; font-weight: 700; transition: transform 0.2s; margin-bottom: 10px; }
  .rsvp-btn:hover { transform: scale(1.02); }

  .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 24px; margin-top: 20px; }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

  @media (max-width: 768px) {
    .main-content { grid-template-columns: 1fr; }
    .container { padding: 20px; }
  }
</style>
</head>
<body>

<div class="container" id="details-root">Syncing with Asterum Database...</div>

<script>
  const SPREADSHEET_ID = '2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW';
  const TIMELINE_GID = '1296117535';
  const DETAILS_GID = '1063823403'; 

  async function fetchCSV(gid) {
    const response = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${gid}&single=true&output=csv`);
    const csv = await response.text();
    return csv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
  }

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    if (min === max) return `₱${Number(min).toLocaleString()}`;
    return `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    if (!eventId) return;

    try {
      const [timelineRows, detailRows] = await Promise.all([fetchCSV(TIMELINE_GID), fetchCSV(DETAILS_GID)]);
      const tData = timelineRows.find(r => r[13] === eventId); 
      const dData = detailRows.find(r => r[0] === eventId);

      if (!tData) {
        document.getElementById('details-root').innerHTML = "Event not found.";
        return;
      }

      // Basic Info (Timeline Tab)
      const dateStr = `${tData[0]} ${new Date(2000, tData[1]-1).toLocaleString('default', {month:'long'})} ${tData[2]}`;
      const title = tData[3], startT = tData[4], endT = tData[5], location = tData[6], timelineImg = tData[7];
      const cat = tData[8], minP = tData[9], maxP = tData[10], dress = tData[11], mapLink = tData[12];
      
      // Elaborate Info (EventDetails Tab)
      const desc = dData ? dData[1] : "";
      const rsvp = dData ? dData[2] : "";
      const gallery = dData ? dData[3] : "";
      const video = dData ? dData[4] : "";

      // Build Gallery HTML
      let galleryHtml = '';
      if (gallery) {
        galleryHtml = `
          <div class="gallery-section">
            <h3 style="font-size:14px; text-transform:uppercase; color:var(--theme-purple);">Event Gallery</h3>
            <div class="carousel-track">
              ${gallery.split(',').map(img => `<div class="carousel-item"><img src="${img.trim()}"></div>`).join('')}
            </div>
            <p style="text-align:center; font-size:11px; opacity:0.5; margin-top:10px;">Swipe to view more photos ↔</p>
          </div>`;
      }

      document.getElementById('details-root').innerHTML = `
        <a href="index.html" class="back-btn">← Back to Timeline</a>
        
        <div class="header-section">
          <span class="cat-tag">${cat}</span>
          <h1>${title}</h1>
          <div class="quick-meta">
            <span>📅 ${dateStr}</span>
            <span>⏰ ${startT}${endT ? ' – ' + endT : ''}</span>
            <span>📍 <a href="${mapLink}" target="_blank" style="color:inherit; font-weight:500;">${location}</a></span>
            <span>🎟️ ${formatPrice(minP, maxP)}</span>
          </div>
        </div>

        <div class="featured-banner">
          <img src="${timelineImg}" alt="Event Banner">
        </div>

        <div class="main-content">
          <div class="description-area">
            ${desc ? `<div class="description">
              <h3 style="font-size:13px; text-transform:uppercase; color:var(--theme-purple); margin-bottom:15px;">Event Overview</h3>
              ${desc}
            </div>` : ''}

            ${video ? `<div class="video-container"><iframe src="${video}" allowfullscreen></iframe></div>` : ''}
            
            ${galleryHtml}
          </div>

          <div class="sidebar">
            ${rsvp ? `<a href="${rsvp}" class="rsvp-btn" target="_blank">RSVP / REGISTER</a>` : ''}
            
            ${dress ? `
              <div class="info-box">
                <h3>Dress Code</h3>
                <div>${dress.split(',').map(d => `<span class="dress-chip">${d.trim()}</span>`).join('')}</div>
              </div>` : ''}

            <div class="info-box" style="background: rgba(168,127,232,0.05);">
              <h3>Important Note</h3>
              <p style="font-size:13px; margin:0; line-height:1.5;">Please arrive at least 15 minutes before the scheduled time. Don't forget your lightsticks! 💙</p>
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      document.getElementById('details-root').innerHTML = "Error connecting to the Asterum Database.";
    }
  }
  init();
</script>
</body>
</html>
