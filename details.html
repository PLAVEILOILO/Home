<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asterum | Event Details</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #faf7ff; --surface: #ffffff; --text: #1e1530; 
    --theme-purple: #a87fe8; --accent: #6c5ce7; 
    --border: rgba(180,160,220,0.2); 
    --price-red: #963252;
  }
  
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; }
  .container { width: min(1000px, 100%); background: var(--surface); padding: 40px; border-radius: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); box-sizing: border-box; margin: 20px auto; }
  
  .header-flex { display: flex; flex-direction: column; text-align: center; justify-content: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 30px; }
  .logo-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .event-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--theme-purple); background: #eee; }
  .header-text h1 { font-family: 'Playfair Display', serif; font-size: clamp(24px, 4vw, 42px); margin: 5px 0; line-height: 1.1; font-weight: 700; }
  
  .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: center; }
  .tag-cat { padding: 4px 10px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; border: 1px solid rgba(0,0,0,0.1); }
  .tag-member { padding: 4px 12px; border-radius: 20px; font-size: 9px; font-weight: 700; text-transform: uppercase; border: 1.5px solid transparent; }
  .quick-meta { display: flex; flex-wrap: wrap; gap: 20px; font-size: 15px; margin-top: 15px; color: #555; justify-content: center; }

  .main-content { max-width: 800px; margin: 0 auto; text-align: center; }
  .description { line-height: 1.8; font-size: 17px; white-space: pre-line; margin-bottom: 30px; color: #333; text-align: center; }
  
  .video-section { margin: 40px auto; display: flex; flex-direction: column; gap: 20px; align-items: center; width: 100%; }
  .video-wrapper { 
    width: 100%;
    max-width: 315px; 
    position: relative; 
    padding-bottom: 177.77%; 
    height: 0; 
    overflow: hidden; 
    border-radius: 24px; 
    background: #000; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
  }
  .video-wrapper.landscape { max-width: 600px; padding-bottom: 56.25%; }
  .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

  .action-area { margin: 40px 0; display: flex; flex-direction: column; align-items: center; gap: 15px; }
  .rsvp-btn { display: inline-block; width: min(400px, 100%); text-align: center; background: var(--accent); color: white; padding: 18px; border-radius: 16px; text-decoration: none; font-weight: 700; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.2); }
  .rsvp-btn:hover { transform: translateY(-2px); }

  .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 40px; }
  .gallery-item { position: relative; aspect-ratio: 3/2; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); animation: fadeIn 0.6s ease forwards; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
  
  .more-overlay {
    position: absolute; inset: 0; background: rgba(30, 21, 48, 0.75);
    color: white; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-weight: 700; font-size: 22px; cursor: pointer;
    backdrop-filter: blur(4px); z-index: 2;
  }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .back-btn { text-decoration: none; color: var(--theme-purple); font-weight: 600; font-size: 14px; margin-bottom: 25px; display: inline-flex; align-items: center; }
  @media (max-width: 600px) { .gallery-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="details-root"></div>

<script>
  const SPREADSHEET_ID = '2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW';
  const TIMELINE_GID = '1296117535';
  const DETAILS_GID = '1063823403';

  const memberPalette = {
    "Yejun": { bg: "#0055fb15", text: "#0055fb" },
    "Noah": { bg: "#ac7dfa15", text: "#ac7dfa" },
    "Bamby": { bg: "#ff76a215", text: "#ff76a2" },
    "Eunho": { bg: "#ff2f2f15", text: "#ff2f2f" },
    "Hamin": { bg: "#2be24f15", text: "#1fa138" }
  };

  async function fetchCSV(gid) {
    try {
      const response = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${gid}&single=true&output=csv`);
      const csv = await response.text();
      return csv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
    } catch (e) { return []; }
  }

  function getYoutubeEmbed(url) {
    if (!url || typeof url !== 'string' || url.length < 5) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
    const match = url.match(regExp);
    const videoId = (match && match[2].length === 11) ? match[2] : null;
    if (videoId) {
      return {
        url: `https://www.youtube.com/embed/${videoId}?rel=0`,
        isShort: url.toLowerCase().includes('shorts')
      };
    }
    return null;
  }

  function generateGallery(images) {
    const validImages = images.filter(img => img && img.includes('http'));
    if (validImages.length === 0) return '';
    const limit = 4;
    const remaining = validImages.length - limit;
    let html = '<div class="gallery-grid" id="eventGallery">';
    validImages.forEach((img, index) => {
      const isHidden = index >= limit;
      html += `
        <div class="gallery-item" ${isHidden ? 'style="display:none"' : ''}>
          <img src="${img.trim()}" loading="lazy">
          ${(index === limit - 1 && remaining > 0) ? `
            <div class="more-overlay" id="galleryTrigger" onclick="expandGallery()">+${remaining}<span>View All</span></div>` : ''}
        </div>`;
    });
    return html + '</div>';
  }

  window.expandGallery = function() {
    document.querySelectorAll('.gallery-item').forEach(item => item.style.display = 'block');
    if (document.getElementById('galleryTrigger')) document.getElementById('galleryTrigger').remove();
  };

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    const root = document.getElementById('details-root');
    if (!eventId) return;

    try {
      const [tRows, dRows] = await Promise.all([fetchCSV(TIMELINE_GID), fetchCSV(DETAILS_GID)]);
      const tData = tRows.find(r => r[12] === eventId);
      const dData = dRows.find(r => r[0] === eventId);
      if (!tData) { root.innerHTML = "Event not found."; return; }

      // Safe Data Extraction
      const categories = (tData[7] || "").split(',').filter(Boolean);
      const members = (tData[13] || "").split(',').filter(Boolean);
      const headerLogos = (tData[6] || "").split(',').filter(Boolean);
      const description = dData ? (dData[1] || "") : "";
      const rsvpLink = dData ? (dData[2] || "") : "";
      const galleryImages = dData && dData[3] ? dData[3].split(',') : [];
      const videoLinks = dData && dData[4] ? dData[4].split(',') : [];

      // Tags
      const catHtml = categories.map(c => `<span class="tag-cat">${c.trim()}</span>`).join('');
      const memHtml = members.map(m => {
        const s = memberPalette[m.trim()] || { bg: "#eee", text: "#666" };
        return `<span class="tag-member" style="background:${s.bg}; color:${s.text}; border-color:${s.text}30">✦ ${m.trim()}</span>`;
      }).join('');

      // Videos logic
      let videoHtml = "";
      const validVideos = videoLinks.map(l => getYoutubeEmbed(l.trim())).filter(v => v !== null);
      if (validVideos.length > 0) {
        videoHtml = `<div class="video-section">` + validVideos.map(v => `
          <div class="video-wrapper ${v.isShort ? '' : 'landscape'}">
            <iframe src="${v.url}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
          </div>`).join('') + `</div>`;
      }

      root.innerHTML = `
        <div class="container">
          <a href="asterum-events.html" class="back-btn">← Back</a>
          <div class="header-flex">
            <div class="logo-group">${headerLogos.map(img => `<img src="${img.trim()}" class="event-logo">`).join('')}</div>
            <div class="header-text">
              <div class="tag-container">${catHtml} ${memHtml}</div>
              <h1>${tData[2]}</h1>
              <div class="quick-meta">
                <span>📅 ${tData[0]}</span>
                ${tData[3] ? `<span>⏰ ${tData[3]}</span>` : ''}
                ${tData[5] ? `<span>📍 ${tData[5]}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="main-content">
            ${description ? `<div class="description">${description}</div>` : ''}
            ${rsvpLink ? `<div class="action-area"><a href="${rsvpLink}" class="rsvp-btn" target="_blank">RSVP NOW</a></div>` : ''}
            ${videoHtml}
            ${generateGallery(galleryImages)}
          </div>
        </div>`;
    } catch (err) {
      console.error(err);
      root.innerHTML = "Error loading content.";
    }
  }
  init();
</script>
</body>
</html>
