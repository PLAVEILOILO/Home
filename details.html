<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asterum | Event Details</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --text: #1e1530;
    --theme-purple: #a87fe8; --accent: #6c5ce7; --border: rgba(180,160,220,0.2);
  }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
  .container { width: min(1000px, 100%); background: var(--surface); padding: 40px; border-radius: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); box-sizing: border-box; }
  
  /* Header with Circle Logo */
  .header-flex { display: flex; align-items: center; gap: 25px; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 30px; }
  .event-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--theme-purple); flex-shrink: 0; }
  .header-text h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 4vw, 42px); margin: 5px 0; }
  
  .back-btn { text-decoration: none; color: var(--theme-purple); font-weight: 600; font-size: 14px; margin-bottom: 20px; display: inline-block; }
  .quick-meta { display: flex; flex-wrap: wrap; gap: 15px; font-size: 14px; opacity: 0.8; }

  .main-content { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; }

  /* Rolling Carousel (Visible Neighbors) */
  .gallery-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 30px; overflow: hidden; }
  .carousel-viewport { width: 100%; overflow: hidden; position: relative; }
  
  .carousel-track { 
    display: flex; 
    gap: 15px; 
    overflow-x: auto; 
    scroll-snap-type: x mandatory; 
    scrollbar-width: none; 
    scroll-behavior: smooth;
    padding: 10px 0;
  }
  .carousel-track::-webkit-scrollbar { display: none; }
  
  .carousel-item { 
    flex: 0 0 60%; /* Shows 60% of current image + bits of others */
    scroll-snap-align: center; 
    transition: transform 0.3s ease;
  }
  .carousel-item img { 
    width: 100%; 
    aspect-ratio: 3/4; 
    object-fit: cover; 
    border-radius: 20px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  .description { line-height: 1.8; font-size: 17px; white-space: pre-line; margin-bottom: 30px; }
  .sidebar { display: flex; flex-direction: column; gap: 20px; }
  .info-box { background: #fcfaff; padding: 25px; border-radius: 24px; border: 1px solid var(--border); }
  .info-box h3 { margin: 0 0 12px 0; font-size: 13px; text-transform: uppercase; color: var(--theme-purple); letter-spacing: 1px; }
  .dress-chip { display: inline-block; background: #eee; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin: 2px; }
  .rsvp-btn { display: block; text-align: center; background: var(--accent); color: white; padding: 18px; border-radius: 16px; text-decoration: none; font-weight: 700; margin-bottom: 10px; }

  .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 24px; margin: 20px 0; }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

  @media (max-width: 768px) {
    .main-content { grid-template-columns: 1fr; }
    .header-flex { flex-direction: column; text-align: center; }
    .carousel-item { flex: 0 0 85%; } /* Show more on mobile */
  }
</style>
</head>
<body>

<div class="container" id="details-root">Loading Asterum Details...</div>

<script>
  const SPREADSHEET_ID = '2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW';
  const TIMELINE_GID = '1296117535';
  const DETAILS_GID = '1063823403'; 

  async function fetchCSV(gid) {
    const response = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${gid}&single=true&output=csv`);
    const csv = await response.text();
    return csv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()));
  }

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    return min === max ? `₱${Number(min).toLocaleString()}` : `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    if (!eventId) return;

    try {
      const [timelineRows, detailRows] = await Promise.all([fetchCSV(TIMELINE_GID), fetchCSV(DETAILS_GID)]);
      const tData = timelineRows.find(r => r[13] === eventId); 
      const dData = detailRows.find(r => r[0] === eventId);

      if (!tData) return;

      const dateStr = `${tData[0]} ${new Date(2000, tData[1]-1).toLocaleString('default', {month:'long'})} ${tData[2]}`;
      const title = tData[3], startT = tData[4], endT = tData[5], location = tData[6], timelineImg = tData[7];
      const cat = tData[8], minP = tData[9], maxP = tData[10], dress = tData[11], mapLink = tData[12];
      
      const desc = dData ? dData[1] : "";
      const rsvp = dData ? dData[2] : "";
      const gallery = dData ? dData[3] : "";
      const video = dData ? dData[4] : "";

      let galleryHtml = '';
      if (gallery) {
        galleryHtml = `
          <div class="gallery-section">
            <h3 style="font-size:12px; text-transform:uppercase; color:var(--theme-purple); text-align:center; margin-bottom:20px;">Event Highlights</h3>
            <div class="carousel-viewport">
                <div class="carousel-track" id="auto-carousel">
                ${gallery.split(',').map(img => `<div class="carousel-item"><img src="${img.trim()}"></div>`).join('')}
                </div>
            </div>
          </div>`;
      }

      document.getElementById('details-root').innerHTML = `
        <a href="index.html" class="back-btn">← Back to Timeline</a>
        
        <div class="header-flex">
          <img src="${timelineImg}" class="event-logo">
          <div class="header-text">
            <span style="background:#f3edff; color:var(--theme-purple); padding:3px 8px; border-radius:5px; font-size:10px; font-weight:700; text-transform:uppercase;">${cat}</span>
            <h1>${title}</h1>
            <div class="quick-meta">
              <span>📅 ${dateStr}</span>
              <span>⏰ ${startT}${endT ? ' – ' + endT : ''}</span>
              <span>📍 <a href="${mapLink}" target="_blank" style="color:inherit; font-weight:500;">${location}</a></span>
              <span>🎟️ ${formatPrice(minP, maxP)}</span>
            </div>
          </div>
        </div>

        <div class="main-content">
          <div>
            ${desc ? `<div class="description">${desc}</div>` : ''}
            ${video ? `<div class="video-container"><iframe src="${video}" allowfullscreen></iframe></div>` : ''}
            ${galleryHtml}
          </div>

          <div class="sidebar">
            ${rsvp ? `<a href="${rsvp}" class="rsvp-btn" target="_blank">RSVP / REGISTER</a>` : ''}
            ${dress ? `<div class="info-box"><h3>Dress Code</h3><div>${dress.split(',').map(d => `<span class="dress-chip">${d.trim()}</span>`).join('')}</div></div>` : ''}
          </div>
        </div>
      `;

      if (gallery) {
        const track = document.getElementById('auto-carousel');
        let index = 0;
        const items = track.querySelectorAll('.carousel-item');
        
        setInterval(() => {
          index = (index + 1) % items.length;
          const scrollAmount = items[index].offsetLeft - (track.offsetWidth / 2) + (items[index].offsetWidth / 2);
          track.scrollTo({ left: scrollAmount, behavior: 'smooth' });
        }, 3000);
      }

    } catch (err) { console.error(err); }
  }
  init();
</script>
</body>
</html>
