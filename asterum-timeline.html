<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asterum Timeline | PLAVE Iloilo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --border: rgba(180,160,220,0.2);
    --text: #1e1530; --theme-purple: #a87fe8; --accent: #6c5ce7;
  }

  body {
    font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
  }

  /* Background Elements */
  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); width: 400px; height: 400px; opacity: 0.3; }
  .orb-1 { background: #ddd0fa; top: -10%; left: -10%; }
  .orb-2 { background: #fbd5e8; bottom: -5%; right: -5%; }

  header { text-align: center; margin: 20px 0 30px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 8vw, 38px); margin: 0; }

  /* Filter Section with Separator */
  .filter-container {
    width: min(900px, 100%);
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 24px;
    border: 1px solid var(--border);
    margin-bottom: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    align-items: flex-start;
  }

  .filter-section { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 250px; }
  .filter-label { 
    font-size: 11px; font-weight: 700; text-transform: uppercase; 
    letter-spacing: 1.5px; color: var(--theme-purple); opacity: 0.8;
    text-align: center;
  }

  .filter-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  
  .filter-chip {
    padding: 8px 16px; border-radius: 100px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 13px;
    cursor: pointer; transition: all 0.2s ease;
  }
  .filter-chip.active {
    background: var(--theme-purple); color: white; border-color: var(--theme-purple);
    box-shadow: 0 4px 12px rgba(168, 127, 232, 0.2);
  }

  /* Vertical Divider for Desktop */
  .divider { width: 1px; background: var(--border); align-self: stretch; }

  /* Timeline Styles */
  .timeline { width: min(800px, 100%); display: flex; flex-direction: column; gap: 20px; }
  .event-link { text-decoration: none; color: inherit; display: block; width: 100%; }
  .event-card {
    background: var(--surface); border-radius: 24px; display: grid;
    grid-template-columns: 180px 1fr; border: 1px solid var(--border);
    overflow: hidden; transition: transform 0.2s;
  }
  .event-card:hover { transform: translateY(-3px); }
  .event-img { width: 100%; height: 100%; object-fit: cover; }
  .event-info { padding: 24px; display: flex; flex-direction: column; min-width: 0; }
  
  .category-tag { 
    display: inline-block; padding: 4px 10px; border-radius: 6px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px;
  }

  .status-row { 
    display: flex; justify-content: space-between; align-items: flex-end; 
    margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--border); 
  }
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; }
  .badge-soon { background: var(--theme-purple); color: white; }
  .badge-ended { background: #eee; color: #888; }

  @media (max-width: 768px) {
    .divider { width: 100%; height: 1px; }
    .event-card { grid-template-columns: 1fr; }
    .event-img { height: 180px; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<header>
  <h1>Asterum <em>Timeline</em></h1>
</header>

<div class="filter-container">
  <!-- When Section -->
  <div class="filter-section">
    <div class="filter-label">When</div>
    <div class="filter-group" id="timeFilters">
      <button class="filter-chip active" data-value="all" onclick="setTimeFilter(this)">All Time</button>
      <button class="filter-chip" data-value="upcoming" onclick="setTimeFilter(this)">Upcoming</button>
      <button class="filter-chip" data-value="past" onclick="setTimeFilter(this)">Past</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- What Section -->
  <div class="filter-section">
    <div class="filter-label">Category</div>
    <div class="filter-group" id="catFilters">
      <button class="filter-chip active" data-value="all" onclick="setCatFilter(this)">All</button>
    </div>
  </div>
</div>

<div class="timeline" id="timelineContainer"></div>

<script>
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];
  let currentTimeFilter = 'all';
  let currentCatFilter = 'all';

  const catColors = {
    "Anniversary": { bg: "#fff0f6", text: "#d63384" },
    "Birthdays": { bg: "#fff9db", text: "#f59f00" },
    "Online Viewing": { bg: "#e7f5ff", text: "#1c7ed6" },
    "Fan Gathering": { bg: "#f3edff", text: "#a87fe8" }
  };
  const defaultColor = { bg: "#f3edff", text: "#a87fe8" };

  async function loadTimeline() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim()))
        .filter(row => row.length > 3 && row[0] !== "Year");

      allEvents = rows.map(row => ({
        date: new Date(row[0], row[1] - 1, row[2]),
        title: row[3] || "Untitled",
        startTime: row[4], loc: row[6], img: row[7], cat: row[8],
        minP: row[9], maxP: row[10], id: row[13]
      })).sort((a, b) => a.date - b.date);

      const cats = [...new Set(allEvents.map(e => e.cat))].filter(Boolean);
      cats.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'filter-chip';
        btn.textContent = c;
        btn.dataset.value = c;
        btn.onclick = () => setCatFilter(btn);
        document.getElementById('catFilters').appendChild(btn);
      });

      filterEvents();
    } catch (e) { document.getElementById('timelineContainer').innerHTML = "Error loading Asterum."; }
  }

  function setTimeFilter(el) {
    document.querySelectorAll('#timeFilters .filter-chip').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentTimeFilter = el.dataset.value;
    filterEvents();
  }

  function setCatFilter(el) {
    document.querySelectorAll('#catFilters .filter-chip').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentCatFilter = el.dataset.value;
    filterEvents();
  }

  function filterEvents() {
    const container = document.getElementById('timelineContainer');
    const now = new Date(); now.setHours(0,0,0,0);

    const filtered = allEvents.filter(ev => {
      const isPast = ev.date < now;
      const timeMatch = (currentTimeFilter === 'all') || (currentTimeFilter === 'past' && isPast) || (currentTimeFilter === 'upcoming' && !isPast);
      const catMatch = (currentCatFilter === 'all') || (ev.cat === currentCatFilter);
      return timeMatch && catMatch;
    });

    container.innerHTML = filtered.map(ev => {
      const isPast = ev.date < now;
      const colors = catColors[ev.cat] || defaultColor;
      const hasLoc = ev.loc && ev.loc.toLowerCase() !== "tba";
      
      const card = `
        <div class="event-card">
          <img src="${ev.img}" class="event-img" onerror="this.style.display='none'">
          <div class="event-info">
            <div><span class="category-tag" style="background:${colors.bg}; color:${colors.text}">${ev.cat}</span></div>
            <h2 style="margin:0 0 10px 0; font-size:20px;">${ev.title}</h2>
            <div class="details-list">
              <div>📅 ${ev.date.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })}</div>
              ${hasLoc ? `<div>📍 ${ev.loc}</div>` : ''}
            </div>
            <div class="status-row">
              <div style="font-size:12px; font-weight:600;">⏰ ${ev.startTime || 'TBA'}</div>
              <span class="badge ${isPast ? 'badge-ended' : 'badge-soon'}">${isPast ? 'ENDED' : 'SOON'}</span>
            </div>
          </div>
        </div>`;
      return ev.id ? `<a href="details.html?id=${encodeURIComponent(ev.id)}" class="event-link">${card}</a>` : card;
    }).join('');
  }

  loadTimeline();
</script>
</body>
</html>
