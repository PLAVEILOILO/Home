<script>
  // Use your actual Sheet URL here
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];

  async function loadTimeline() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      
      // We split the CSV and filter out empty rows or the header row
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim()))
        .filter(row => row.length > 3 && row[0] !== "Year");

      allEvents = rows.map(row => {
        // Map columns carefully. 
        // If you added Min/Max price, they are row[9] and row[10]
        return {
          date: new Date(row[0], row[1] - 1, row[2]), // Year, Month, Day
          title: row[3] || "Untitled Event",
          startTime: row[4] || "",
          endTime: row[5] || "",
          loc: row[6] || "TBA",
          img: row[7] || "",
          cat: row[8] || "Event",
          minP: row[9] || "0",
          maxP: row[10] || "0"
        };
      }).sort((a, b) => a.date - b.date);

      filterEvents();
    } catch (e) {
      console.error("Error loading Sheet:", e);
      document.getElementById('timelineContainer').innerHTML = "Error connecting to Asterum.";
    }
  }

  // Helper function to format the price range
  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free";
    if (min === max) return `₱${Number(min).toLocaleString()}`;
    return `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  // Helper function to format the time range
  function formatTime(start, end) {
    if (!start) return "Time TBA";
    if (!end) return start;
    return `${start} – ${end}`;
  }

  function filterEvents() {
    const timeVal = document.getElementById('timeFilter').value;
    const catVal = document.getElementById('catFilter').value;
    const container = document.getElementById('timelineContainer');
    const now = new Date();
    now.setHours(0,0,0,0);

    const filtered = allEvents.filter(ev => {
      const isPast = ev.date < now;
      const timeMatch = (timeVal === 'all') || (timeVal === 'past' && isPast) || (timeVal === 'upcoming' && !isPast);
      const catMatch = (catVal === 'all') || (ev.cat.trim() === catVal.trim());
      return timeMatch && catMatch;
    });

    container.innerHTML = filtered.map(ev => {
      const diffDays = Math.ceil((ev.date - now) / (1000 * 60 * 60 * 24));
      const isPast = diffDays < 0;

      let statusBadge = isPast ? '<span class="badge badge-ended">ENDED</span>' : '<span class="badge badge-soon">SOON</span>';
      let countdownText = "";
      if (diffDays === 0) countdownText = "Happening Today!";
      else if (diffDays === 1) countdownText = "Tomorrow!";
      else if (diffDays > 1) countdownText = `In ${diffDays} days`;

      return `
        <div class="event-card">
          <img src="${ev.img}" class="event-img" onerror="this.src='https://via.placeholder.com/150?text=PLAVE'">
          <div class="event-info">
            <div class="event-header">
              <div>
                <div class="category-tag">${ev.cat}</div>
                <h2 class="event-title">${ev.title}</h2>
              </div>
              <div class="status-area">
                ${statusBadge}
                <div class="countdown">${isPast ? '' : countdownText}</div>
              </div>
            </div>
            <div class="details">
              📅 ${ev.date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}<br>
              ⏰ ${formatTime(ev.startTime, ev.endTime)} | 📍 ${ev.loc}
            </div>
            <div class="price" style="font-weight:600; color:var(--theme-pink);">${formatPrice(ev.minP, ev.maxP)}</div>
          </div>
        </div>
      `;
    }).join('');

    if(filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; opacity:0.5; margin-top:40px;">No cosmic events found for this filter.</p>';
    }
  }

  loadTimeline();
</script>
