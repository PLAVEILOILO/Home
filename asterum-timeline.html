<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asterum Timeline | PLAVE Iloilo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --border: rgba(180,160,220,0.2);
    --text: #1e1530; --theme-purple: #a87fe8; --accent: #6c5ce7;
  }

  body {
    font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
  }

  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); width: 400px; height: 400px; opacity: 0.3; }
  .orb-1 { background: #ddd0fa; top: -10%; left: -10%; }
  .orb-2 { background: #fbd5e8; bottom: -5%; right: -5%; }

  header { text-align: center; margin: 20px 0 10px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 8vw, 38px); margin: 0; }

  .filter-bar { 
    width: min(850px, 100%); display: flex; justify-content: center; 
    gap: 12px; margin-bottom: 30px; padding: 10px; flex-wrap: wrap;
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; max-width: 200px; }
  .filter-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--theme-purple); padding-left: 5px; }

  select {
    padding: 10px 15px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface); font-family: inherit; font-size: 13px; color: var(--text);
    outline: none; cursor: pointer; appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a87fe8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 16px; padding-right: 35px;
  }

  .timeline { width: min(800px, 100%); display: flex; flex-direction: column; gap: 20px; }
  
  /* --- Event Card & Image Swiper --- */
  .event-card {
    background: var(--surface); border-radius: 24px; display: grid;
    grid-template-columns: 180px 1fr; border: 1.5px solid var(--border);
    overflow: hidden; transition: all 0.2s; position: relative;
  }
  .event-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

  .img-container { position: relative; width: 180px; height: 100%; overflow: hidden; background: #eee; }
  .event-img { 
    position: absolute; width: 100%; height: 100%; object-fit: cover; 
    transition: opacity 0.8s ease-in-out; opacity: 0;
  }
  .event-img.active { opacity: 1; position: relative; } /* Relative keeps the container height */

  .event-info { padding: 24px; display: flex; flex-direction: column; min-width: 0; }
  
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .category-tag, .member-tag { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .member-tag { background: #eee; color: #333; letter-spacing: 0.5px; }

  .event-title { margin: 0 0 10px 0; font-size: 18px; line-height: 1.3; }
  .title-divider { height: 1px; background: var(--border); margin: 5px 0; border: none; }

  .details-list { font-size: 13px; opacity: 0.8; display: flex; flex-direction: column; gap: 6px; }
  .status-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 15px; border-top: 1px dashed var(--border); }
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; }
  .badge-soon { background: var(--theme-purple); color: white; }
  .badge-ended { background: #eee; color: #888; }

  #backToTop { position: fixed; bottom: 30px; right: 30px; width: 45px; height: 45px; border-radius: 50%; background: var(--accent); color: white; border: none; cursor: pointer; display: none; z-index: 1000; }

  @media (max-width: 600px) {
    .event-card { grid-template-columns: 1fr; }
    .img-container { width: 100%; height: 200px; }
    .event-img.active { position: absolute; }
  }
</style>
</head>
<body>

<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<header><h1>Asterum <em>Timeline</em></h1></header>

<div class="filter-bar">
  <div class="filter-group"><label class="filter-label">Timeline</label><select id="timeFilter" onchange="filterEvents()"><option value="all">All Events</option><option value="upcoming">Upcoming</option><option value="past">Past</option></select></div>
  <div class="filter-group"><label class="filter-label">Category</label><select id="catFilter" onchange="filterEvents()"><option value="all">All Categories</option></select></div>
  <div class="filter-group"><label class="filter-label">Sorting</label><select id="sortOrder" onchange="filterEvents()"><option value="asc">Earliest</option><option value="desc">Latest</option></select></div>
</div>

<div class="timeline" id="timelineContainer"></div>
<button id="backToTop" onclick="scrollToTop()">↑</button>

<script>
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];

  const memberStyles = {
    "Yejun": { border: "#4B92FF", bg: "#eef5ff", text: "#4B92FF" },
    "Noah": { border: "#A076FF", bg: "#f5f0ff", text: "#A076FF" },
    "Bamby": { border: "#FF7EB3", bg: "#fff0f6", text: "#FF7EB3" },
    "Eunho": { border: "#FF4D4D", bg: "#fff0f0", text: "#FF4D4D" },
    "Hamin": { border: "#2ECC71", bg: "#e9f9ee", text: "#2ECC71" },
    "PLAVE": { border: "#a87fe8", bg: "#f3edff", text: "#a87fe8" }
  };

  async function loadTimeline() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim()))
        .filter(row => row.length > 5 && row[0] !== "Start Date");

      allEvents = rows.map(row => ({
        start: new Date(row[0]), end: row[1] ? new Date(row[1]) : null,
        titles: (row[2] || "Untitled").split(','), // Split titles
        startTime: row[3] || "", endTime: row[4] || "",
        loc: row[5] || "TBA", 
        imgs: (row[6] || "").split(','), // Split images
        cat: row[7] || "Event",
        minP: row[8] || "0", maxP: row[9] || "0", 
        dress: row[10] || "", locLink: row[11] || "",
        id: row[12] || "", 
        members: (row[13] || "").split(',') // Split members
      }));

      const allCats = [...new Set(allEvents.flatMap(e => e.cat.split(',').map(c => c.trim())))].filter(Boolean);
      const catSelect = document.getElementById('catFilter');
      allCats.forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = c; catSelect.appendChild(opt); });

      filterEvents();
      startImageSwiper(); // Trigger the swiping logic
    } catch (e) { document.getElementById('timelineContainer').innerHTML = "Error loading Asterum."; }
  }

  function filterEvents() {
    const timeVal = document.getElementById('timeFilter').value;
    const catVal = document.getElementById('catFilter').value;
    const sortVal = document.getElementById('sortOrder').value;
    const container = document.getElementById('timelineContainer');
    const now = new Date(); now.setHours(0,0,0,0);

    let filtered = allEvents.filter(ev => {
      const isPast = (ev.end || ev.start) < now;
      const timeMatch = (timeVal === 'all') || (timeVal === 'past' && isPast) || (timeVal === 'upcoming' && !isPast);
      return timeMatch && (catVal === 'all' || ev.cat.split(',').includes(catVal));
    });

    filtered.sort((a, b) => sortVal === 'asc' ? a.start - b.start : b.start - a.start);

    container.innerHTML = filtered.map(ev => {
      const isPast = (ev.end || ev.start) < now;
      const statusBadge = isPast ? '<span class="badge badge-ended">ENDED</span>' : '<span class="badge badge-soon">SOON</span>';
      
      // Handle Multiple Titles
      const titleHtml = ev.titles.map(t => `<h2 class="event-title">${t.trim()}</h2>`).join('<hr class="title-divider">');
      
      // Handle Multiple Images
      const imgHtml = ev.imgs.map((img, i) => `<img src="${img.trim()}" class="event-img ${i===0?'active':''}" loading="lazy">`).join('');
      
      // Handle Multiple Members (takes first member for border color)
      const primaryMember = ev.members[0]?.trim();
      const mStyle = memberStyles[primaryMember] || memberStyles["PLAVE"];
      const memberTags = ev.members.map(m => {
        const s = memberStyles[m.trim()] || memberStyles["PLAVE"];
        return `<div class="member-tag" style="background:${s.bg}; color:${s.text};">✦ ${m.trim()}</div>`;
      }).join('');

      return `
        <div class="event-card" style="border-color: ${mStyle.border}; border-width: 2px;">
          <div class="img-container">${imgHtml}</div>
          <div class="event-info">
            <div class="tag-row">${memberTags}</div>
            ${titleHtml}
            <div class="details-list">
              <div>📅 ${ev.start.toDateString()}</div>
              <div>📍 ${ev.loc}</div>
            </div>
            <div class="status-row">
              <div class="meta-item">🎟️ ₱${ev.minP}</div>
              ${statusBadge}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // Swiper Logic: Rotates images every 3 seconds if there's more than one
  function startImageSwiper() {
    setInterval(() => {
      const containers = document.querySelectorAll('.img-container');
      containers.forEach(container => {
        const imgs = container.querySelectorAll('.event-img');
        if (imgs.length <= 1) return;

        let currentIndex = Array.from(imgs).findIndex(img => img.classList.contains('active'));
        imgs[currentIndex].classList.remove('active');
        let nextIndex = (currentIndex + 1) % imgs.length;
        imgs[nextIndex].classList.add('active');
      });
    }, 3000); // Swaps every 3 seconds
  }

  function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  loadTimeline();
</script>
</body>
</html>
