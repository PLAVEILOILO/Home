<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asterum Timeline | PLAVE Iloilo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff;
    --surface: #ffffff;
    --border: rgba(180,160,220,0.2);
    --text: #1e1530;
    --theme-purple: #a87fe8;
    --theme-pink: #e87bb5;
    --accent: #6c5ce7;
  }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); width: 400px; height: 400px; opacity: 0.3; }
  .orb-1 { background: #ddd0fa; top: -10%; left: -10%; }
  .orb-2 { background: #fbd5e8; bottom: -5%; right: -5%; }

  header { text-align: center; margin: 20px 0 30px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 8vw, 38px); margin: 0; }

  .controls { width: min(800px, 100%); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; justify-content: center; }
  select {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: white; font-family: inherit; cursor: pointer; font-size: 13px; outline: none;
  }

  .timeline { width: min(800px, 100%); display: flex; flex-direction: column; gap: 20px; }
  
  /* Link wrapper styling */
  .event-link { text-decoration: none; color: inherit; display: block; width: 100%; }

  .event-card {
    background: var(--surface); 
    border-radius: 24px; 
    display: grid;
    grid-template-columns: 180px 1fr;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(168,127,232,0.05); 
    transition: transform 0.2s;
    overflow: hidden;
    cursor: pointer;
  }
  .event-card:hover { transform: translateY(-3px); }

  .event-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  .event-info { 
    display: flex; 
    flex-direction: column; 
    padding: 24px;
    min-width: 0;
  }

  .tag-row { display: flex; align-items: flex-start; margin-bottom: 8px; }
  
  .category-tag { 
    display: inline-block; padding: 4px 12px; border-radius: 8px;
    background: #f3edff; color: var(--theme-purple);
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px; 
    font-weight: 700;
  }
  
  .event-title { font-size: clamp(18px, 5vw, 22px); font-weight: 600; margin: 0 0 10px 0; line-height: 1.2; }
  
  .details-list { 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    font-size: 13px; 
    opacity: 0.8; 
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .loc-link { color: inherit; text-decoration: none; }
  .loc-link:hover { color: var(--accent); text-decoration: underline; }

  .dress-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dress-chip {
    padding: 2px 10px; border-radius: 6px;
    background: #D9D9D9; 
    color: #242424;
    font-size: 11px; font-weight: 600;
    border: 1px solid rgba(168, 127, 232, 0.1);
  }

  .status-row { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-end; 
    margin-top: auto; 
    padding-top: 10px; 
    border-top: 1px dashed var(--border); 
  }
  .meta-group { display: flex; flex-direction: column; gap: 2px; }
  .meta-item { font-size: 12px; font-weight: 600; }
  
  .badge-group { text-align: right; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; margin-bottom: 2px; }
  .badge-soon { background: var(--theme-purple); color: white; }
  .badge-ended { background: #eee; color: #888; }
  .countdown { font-size: 11px; font-weight: 700; color: var(--accent); }

  @media (max-width: 600px) {
    .event-card { grid-template-columns: 1fr; }
    .event-img { height: 180px; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<header>
  <h1>Asterum <em>Timeline</em></h1>
</header>

<div class="controls">
  <select id="timeFilter" onchange="filterEvents()">
    <option value="upcoming">Upcoming</option>
    <option value="past">Past Events</option>
    <option value="all">All Time</option>
  </select>
  <select id="catFilter" onchange="filterEvents()"><option value="all">All Categories</option></select>
</div>

<div class="timeline" id="timelineContainer"></div>

<script>
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];

  async function loadTimeline() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim()))
        .filter(row => row.length > 3 && row[0] !== "Year");

      allEvents = rows.map(row => ({
        date: new Date(row[0], row[1] - 1, row[2]),
        title: row[3] || "Untitled",
        startTime: row[4] || "", endTime: row[5] || "",
        loc: row[6] || "TBA", img: row[7] || "", cat: row[8] || "Event",
        minP: row[9] || "0", maxP: row[10] || "0", dress: row[11] || "",
        locLink: row[12] || "",
        id: row[13] || "" // Column N
      })).sort((a, b) => a.date - b.date);

      const cats = [...new Set(allEvents.map(e => e.cat))];
      cats.forEach(c => { if(c) document.getElementById('catFilter').innerHTML += `<option value="${c}">${c}</option>`; });
      filterEvents();
    } catch (e) { document.getElementById('timelineContainer').innerHTML = "Error loading Asterum."; }
  }

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free";
    if (min === max) return `₱${Number(min).toLocaleString()}`;
    return `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  function filterEvents() {
    const timeVal = document.getElementById('timeFilter').value;
    const catVal = document.getElementById('catFilter').value;
    const container = document.getElementById('timelineContainer');
    const now = new Date(); now.setHours(0,0,0,0);

    const filtered = allEvents.filter(ev => {
      const isPast = ev.date < now;
      return ((timeVal === 'all') || (timeVal === 'past' && isPast) || (timeVal === 'upcoming' && !isPast)) &&
             ((catVal === 'all') || (ev.cat.trim() === catVal.trim()));
    });

    container.innerHTML = filtered.map(ev => {
      const diffDays = Math.ceil((ev.date - now) / (1000 * 60 * 60 * 24));
      const isPast = diffDays < 0;
      
      let statusBadge = isPast ? '<span class="badge badge-ended">ENDED</span>' : '<span class="badge badge-soon">SOON</span>';
      let countdownText = (diffDays === 0) ? "Happening Today!" : (diffDays === 1) ? "Tomorrow!" : (diffDays > 1) ? `In ${diffDays} days` : "";

      const dressChips = ev.dress ? ev.dress.split(',').map(item => `<span class="dress-chip">${item.trim()}</span>`).join('') : '';
      
      // Stop link propagation if user clicks the Google Maps link specifically
      const locationDisplay = ev.locLink 
        ? `<a href="${ev.locLink}" target="_blank" class="loc-link" onclick="event.stopPropagation()">📍 ${ev.loc}</a>` 
        : `📍 ${ev.loc}`;

      const cardHtml = `
        <div class="event-card">
          <img src="${ev.img}" class="event-img" loading="lazy" onerror="this.style.display='none'">
          <div class="event-info">
            <div class="tag-row"><div class="category-tag">${ev.cat}</div></div>
            <h2 class="event-title">${ev.title}</h2>
            
            <div class="details-list">
              <div>📅 ${ev.date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
              <div>${locationDisplay}</div>
              ${ev.dress ? `<div class="dress-row">👚 ${dressChips}</div>` : ''}
            </div>

            <div class="status-row">
              <div class="meta-group">
                ${ev.startTime ? `<div class="meta-item" style="color: #2E2E2E;">⏰ ${ev.startTime}${ev.endTime ? ' – ' + ev.endTime : ''}</div>` : ''}
                <div class="meta-item" style="color: #963252;">🎟️ ${formatPrice(ev.minP, ev.maxP)}</div>
              </div>
              <div class="badge-group">
                ${statusBadge}<br>
                <span class="countdown">${isPast ? '' : countdownText}</span>
              </div>
            </div>
          </div>
        </div>`;

      // If ID exists, wrap in link, otherwise return just the card
      return ev.id 
        ? `<a href="details.html?id=${encodeURIComponent(ev.id)}" class="event-link">${cardHtml}</a>` 
        : cardHtml;

    }).join('');

    if(filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; opacity:0.5; margin-top:40px;">No cosmic events found for this filter.</p>';
    }
  }
  loadTimeline();
</script>
</body>
</html>
