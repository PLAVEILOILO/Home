<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asterum | Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --border: rgba(180,160,220,0.2);
    --text: #1e1530; --theme-purple: #7a4ed9; --accent: #6c5ce7; --price-red: #ff4d4d;
  }

  body {
    font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); width: 400px; height: 400px; opacity: 0.3; }
  .orb-1 { background: #ddd0fa; top: -10%; left: -10%; }
  .orb-2 { background: #fbd5e8; bottom: -5%; right: -5%; }

  /* Restored Original Header Style */
  header { text-align: center; margin: 30px 0 40px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 42px; margin: 0; font-weight: 700; }
  header h1 span { font-family: 'Playfair Display', serif; font-weight: 400; font-style: italic; opacity: 0.4; margin: 0 10px; }
  header p { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.5; margin-top: 8px; font-weight: 600; }

  .filter-bar { 
    width: min(900px, 100%); display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 15px; margin-bottom: 30px; padding: 10px;
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; background: white; padding: 12px 18px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border); }
  .filter-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--theme-purple); opacity: 0.7; }

  select { border: none; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; color: var(--text); outline: none; cursor: pointer; background: transparent; }

  .timeline { width: min(900px, 100%); display: flex; flex-direction: column; gap: 20px; }
  
  .event-link { text-decoration: none; color: inherit; display: block; }

  .event-card {
    background: var(--surface); border-radius: 24px; display: grid;
    grid-template-columns: 260px 1fr; border: 2.5px solid transparent;
    overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
    box-shadow: 0 4px 20px rgba(168, 127, 232, 0.08);
  }
  .event-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(168, 127, 232, 0.15); }

  .img-container { position: relative; width: 260px; height: 100%; overflow: hidden; background: #f0f0f0; flex-shrink: 0; }
  .event-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.8s ease-in-out; opacity: 0; }
  .event-img.active { opacity: 1; }

  .event-info { padding: 30px; display: flex; flex-direction: column; min-width: 0; }
  
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  
  .cat-tag { padding: 4px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
  .cat-birthday { background: #e0f7fa; color: #00838f; }
  .cat-anniversary { background: #fff8e1; color: #ff8f00; }
  .cat-event { background: #e8eaf6; color: #283593; }
  .cat-default { background: #f3edff; color: var(--theme-purple); }

  .member-tag { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; border: 1px solid rgba(0,0,0,0.08); }

  .title-wrapper { margin-bottom: 15px; overflow: hidden; }
  .event-title { 
    margin: 0; font-size: 24px; line-height: 1.2; font-family: 'Playfair Display', serif; 
    font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
  }

  .details-list { font-size: 14px; opacity: 0.8; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; font-weight: 500; }
  
  .status-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 18px; border-top: 1.5px dashed var(--border); }
  .price-val { color: var(--price-red); font-weight: 700; font-size: 16px; letter-spacing: -0.3px; }

  .countdown-box { text-align: right; }
  .timer-text { display: block; font-size: 11px; font-weight: 700; color: var(--theme-purple); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { padding: 5px 14px; border-radius: 100px; font-size: 10px; font-weight: 800; letter-spacing: 0.8px; }
  .badge-soon { background: #6c5ce7; color: white; }
  .badge-ended { background: #eeeeee; color: #999; }

  @media (max-width: 768px) {
    .event-card { grid-template-columns: 1fr; }
    .img-container { width: 100%; height: 250px; }
    .filter-bar { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<header>
  <h1>Asterum <span>|</span> Timeline</h1>
  <p>PLAVE Iloilo Event Archive</p>
</header>

<div class="filter-bar">
  <div class="filter-group">
    <label class="filter-label">Timeline</label>
    <select id="timeFilter" onchange="renderTimeline()">
      <option value="all">All Events</option>
      <option value="upcoming">Upcoming</option>
      <option value="past">Past</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label">Category</label>
    <select id="catFilter" onchange="renderTimeline()">
      <option value="all">All Categories</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label">Sorting</label>
    <select id="sortOrder" onchange="renderTimeline()">
      <option value="desc">Latest Added</option>
      <option value="asc">Earliest Added</option>
    </select>
  </div>
</div>

<div class="timeline" id="timelineContainer"></div>

<script>
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];

  const memberStyles = {
    "Yejun": { border: "#4B92FF", bg: "#eef5ff", text: "#4B92FF" },
    "Noah": { border: "#A076FF", bg: "#f5f0ff", text: "#A076FF" }, // Distinct Amethyst
    "Bamby": { border: "#FF7EB3", bg: "#fff0f6", text: "#FF7EB3" },
    "Eunho": { border: "#FF4D4D", bg: "#fff0f0", text: "#FF4D4D" },
    "Hamin": { border: "#2ECC71", bg: "#e9f9ee", text: "#2ECC71" },
    "PLAVE": { border: "#7a4ed9", bg: "#f3edff", text: "#7a4ed9" } // Distinct Darker Purple
  };

  function getCatClass(cat) {
    const c = cat.toLowerCase();
    if (c.includes('birthday')) return 'cat-birthday';
    if (c.includes('anniversary')) return 'cat-anniversary';
    if (c.includes('event')) return 'cat-event';
    return 'cat-default';
  }

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    return min === max ? `₱${Number(min).toLocaleString()}` : `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  function getCountdown(date) {
    const diff = new Date(date) - new Date();
    if (diff < 0) return "";
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    return days > 0 ? `${days}d ${hours}h left` : `${hours}h left`;
  }

  async function loadTimeline() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim()))
        .filter(row => row.length > 5 && row[0] !== "Start Date");

      allEvents = rows.map(row => ({
        start: new Date(row[0]),
        titles: (row[2] || "Untitled").split(',').map(t => t.trim()),
        startTime: row[3] || "",
        loc: row[5] || "TBA", 
        imgs: (row[6] || "").split(','),
        cat: row[7] || "Event",
        minP: row[8] || "0", maxP: row[9] || "0", 
        dress: row[10] || "",
        id: row[12] || "", 
        members: (row[13] || "").split(',').filter(Boolean)
      }));

      const cats = new Set();
      allEvents.forEach(e => e.cat.split(',').forEach(c => c.trim() && cats.add(c.trim())));
      const catSelect = document.getElementById('catFilter');
      cats.forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = c; catSelect.appendChild(opt); });

      renderTimeline();
    } catch (e) { document.getElementById('timelineContainer').innerHTML = "Error loading timeline."; }
  }

  function renderTimeline() {
    const timeVal = document.getElementById('timeFilter').value;
    const catVal = document.getElementById('catFilter').value;
    const sortVal = document.getElementById('sortOrder').value;
    const container = document.getElementById('timelineContainer');
    const now = new Date(); now.setHours(0,0,0,0);

    let filtered = allEvents.filter(ev => {
      const isPast = ev.start < now;
      const timeMatch = (timeVal === 'all') || (timeVal === 'past' && isPast) || (timeVal === 'upcoming' && !isPast);
      return timeMatch && (catVal === 'all' || ev.cat.includes(catVal));
    });

    filtered.sort((a, b) => sortVal === 'asc' ? a.start - b.start : b.start - a.start);

    container.innerHTML = filtered.map(ev => {
      const isPast = ev.start < now;
      const primaryMember = ev.members[0]?.trim();
      const mStyle = memberStyles[primaryMember] || memberStyles["PLAVE"];
      const combinedTitle = ev.titles.join(' • ');

      return `
        <a href="details.html?id=${ev.id}" class="event-link">
          <div class="event-card" style="border-color: ${mStyle.border};">
            <div class="img-container">
              ${ev.imgs.map((img, i) => `<img src="${img.trim()}" class="event-img ${i===0?'active':''}" id="img-${ev.id}-${i}">`).join('')}
            </div>
            <div class="event-info">
              <div class="tag-row">
                ${ev.cat.split(',').map(c => `<div class="cat-tag ${getCatClass(c)}">${c.trim()}</div>`).join('')}
                ${ev.members.map(m => {
                  const s = memberStyles[m.trim()] || memberStyles["PLAVE"];
                  return `<div class="member-tag" style="background:${s.bg}; color:${s.text}; border-color:${s.border}44">✦ ${m.trim()}</div>`;
                }).join('')}
              </div>
              <div class="title-wrapper">
                <h2 class="event-title" title="${combinedTitle}">${combinedTitle}</h2>
              </div>
              <div class="details-list">
                <div>📅 ${ev.start.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})} ${ev.startTime ? ' • ⏰ ' + ev.startTime : ''}</div>
                <div>📍 ${ev.loc}</div>
                ${ev.dress ? `<div>👗 Dress Code: ${ev.dress}</div>` : ''}
              </div>
              <div class="status-row">
                <div class="price-val">🎟️ ${formatPrice(ev.minP, ev.maxP)}</div>
                <div class="countdown-box">
                  ${!isPast ? `<span class="timer-text">${getCountdown(ev.start)}</span>` : ''}
                  <span class="badge ${isPast ? 'badge-ended' : 'badge-soon'}">${isPast ? 'ENDED' : 'SOON'}</span>
                </div>
              </div>
            </div>
          </div>
        </a>`;
    }).join('');

    // Swiper logic
    filtered.forEach(ev => {
      if (ev.imgs.length > 1) {
        let cur = 0;
        const intervalId = setInterval(() => {
          const cImg = document.getElementById(`img-${ev.id}-${cur}`);
          if (cImg) cImg.classList.remove('active');
          cur = (cur + 1) % ev.imgs.length;
          const nImg = document.getElementById(`img-${ev.id}-${cur}`);
          if (nImg) nImg.classList.add('active');
          else clearInterval(intervalId); // Cleanup if element is removed
        }, 4000);
      }
    });
  }

  loadTimeline();
</script>
</body>
</html>
