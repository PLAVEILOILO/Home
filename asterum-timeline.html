<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asterum Timeline | PLAVE Iloilo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff;
    --surface: #ffffff;
    --border: rgba(180,160,220,0.2);
    --text: #1e1530;
    --theme-purple: #a87fe8;
    --theme-pink: #e87bb5;
    --accent: #6c5ce7;
  }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0; padding: 40px 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); width: 400px; height: 400px; opacity: 0.3; }
  .orb-1 { background: #ddd0fa; top: -10%; left: -10%; }
  .orb-2 { background: #fbd5e8; bottom: -5%; right: -5%; }

  header { text-align: center; margin-bottom: 30px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 38px; margin: 0; }

  .controls { width: min(800px, 100%); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; justify-content: center; }
  select {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: white; font-family: inherit; cursor: pointer; font-size: 13px; outline: none;
  }

  .timeline { width: min(800px, 100%); display: flex; flex-direction: column; gap: 20px; }
  
  .event-card {
    background: var(--surface); 
    border-radius: 24px; 
    padding: 0; /* Padding moved to info area for flush image */
    display: flex; 
    gap: 0; 
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(168,127,232,0.05); 
    transition: transform 0.2s;
    overflow: hidden;
    min-height: 180px;
  }
  .event-card:hover { transform: translateY(-3px); }

  .event-img { 
    width: 200px; 
    height: auto; 
    object-fit: cover; 
    flex-shrink: 0; 
  }
  
  .event-info { 
    flex-grow: 1; 
    display: flex; 
    flex-direction: column; 
    padding: 24px;
    justify-content: space-between;
  }

  .event-header { display: flex; justify-content: space-between; align-items: flex-start; }
  
  .tag-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }

  .category-tag { 
    display: inline-block; padding: 4px 12px; border-radius: 8px;
    background: #f3edff; color: var(--theme-purple);
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px; 
    font-weight: 700;
  }

  .dress-tag {
    display: inline-block; padding: 4px 12px; border-radius: 8px;
    background: #fff0f6; color: var(--theme-pink);
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px; 
    font-weight: 700;
    border: 1px solid rgba(232, 123, 181, 0.1);
  }
  
  .event-title { font-size: 22px; font-weight: 600; margin: 0 0 10px 0; line-height: 1.2; }
  
  .details { font-size: 13px; opacity: 0.7; margin-bottom: 15px; line-height: 1.6; }

  .status-area { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; }
  .badge { padding: 4px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; margin-bottom: 8px; }
  .badge-soon { background: var(--theme-purple); color: white; }
  .badge-ended { background: #eee; color: #888; }
  .countdown { font-size: 11px; font-weight: 600; color: var(--accent); }

  .meta-footer {
    display: flex; gap: 15px; font-size: 13px; font-weight: 600; margin-top: auto; padding-top: 10px;
    border-top: 1px dashed var(--border);
  }

  @media (max-width: 600px) {
    .event-card { flex-direction: column; }
    .event-img { width: 100%; height: 180px; }
    .status-area { align-items: flex-start; margin-top: 15px; text-align: left; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<header>
  <h1>Asterum <em>Timeline</em></h1>
</header>

<div class="controls">
  <select id="timeFilter" onchange="filterEvents()">
    <option value="upcoming">Upcoming</option>
    <option value="past">Past Events</option>
    <option value="all">All Time</option>
  </select>
  
  <select id="catFilter" onchange="filterEvents()">
    <option value="all">All Categories</option>
  </select>
</div>

<div class="timeline" id="timelineContainer"></div>

<script>
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];

  async function loadTimeline() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim()))
        .filter(row => row.length > 3 && row[0] !== "Year");

      allEvents = rows.map(row => {
        return {
          date: new Date(row[0], row[1] - 1, row[2]),
          title: row[3] || "Untitled Event",
          startTime: row[4] || "",
          endTime: row[5] || "",
          loc: row[6] || "TBA",
          img: row[7] || "",
          cat: row[8] || "Event",
          minP: row[9] || "0",
          maxP: row[10] || "0",
          dress: row[11] || "" 
        };
      }).sort((a, b) => a.date - b.date);

      const cats = [...new Set(allEvents.map(e => e.cat))];
      const catSelect = document.getElementById('catFilter');
      cats.forEach(c => {
        if(c) catSelect.innerHTML += `<option value="${c}">${c}</option>`;
      });

      filterEvents();
    } catch (e) {
      console.error("Error loading Sheet:", e);
      document.getElementById('timelineContainer').innerHTML = "Error connecting to Asterum.";
    }
  }

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free";
    if (min === max) return `₱${Number(min).toLocaleString()}`;
    return `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  function formatTime(start, end) {
    if (!start) return "Time TBA";
    if (!end) return start;
    return `${start} – ${end}`;
  }

  function filterEvents() {
    const timeVal = document.getElementById('timeFilter').value;
    const catVal = document.getElementById('catFilter').value;
    const container = document.getElementById('timelineContainer');
    const now = new Date();
    now.setHours(0,0,0,0);

    const filtered = allEvents.filter(ev => {
      const isPast = ev.date < now;
      const timeMatch = (timeVal === 'all') || (timeVal === 'past' && isPast) || (timeVal === 'upcoming' && !isPast);
      const catMatch = (catVal === 'all') || (ev.cat.trim() === catVal.trim());
      return timeMatch && catMatch;
    });

    container.innerHTML = filtered.map(ev => {
      const diffDays = Math.ceil((ev.date - now) / (1000 * 60 * 60 * 24));
      const isPast = diffDays < 0;

      let statusBadge = isPast ? '<span class="badge badge-ended">ENDED</span>' : '<span class="badge badge-soon">SOON</span>';
      let countdownText = "";
      if (diffDays === 0) countdownText = "Happening Today!";
      else if (diffDays === 1) countdownText = "Tomorrow!";
      else if (diffDays > 1) countdownText = `In ${diffDays} days`;

      let dressHtml = ev.dress ? `<div class="dress-tag">👗 ${ev.dress}</div>` : '';

      return `
        <div class="event-card">
          <img src="${ev.img}" class="event-img" onerror="this.src='https://via.placeholder.com/200x200?text=PLAVE'">
          <div class="event-info">
            <div class="event-header">
              <div style="flex:1;">
                <div class="tag-container">
                    <div class="category-tag">${ev.cat}</div>
                    ${dressHtml}
                </div>
                <h2 class="event-title">${ev.title}</h2>
              </div>
              <div class="status-area">
                ${statusBadge}
                <div class="countdown">${isPast ? '' : countdownText}</div>
              </div>
            </div>
            
            <div class="details">
              📅 ${ev.date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}<br>
              📍 ${ev.loc}
            </div>

            <div class="meta-footer">
              <span style="color:var(--theme-purple);">⏰ ${formatTime(ev.startTime, ev.endTime)}</span>
              <span style="color:var(--theme-pink);">🎟️ ${formatPrice(ev.minP, ev.maxP)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    if(filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; opacity:0.5; margin-top:40px;">No cosmic events found for this filter.</p>';
    }
  }

  loadTimeline();
</script>
</body>
</html>
