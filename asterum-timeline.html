<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asterum | Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --text: #1e1530;
    --theme-purple: #a87fe8; --accent: #6c5ce7; --border: rgba(180,160,220,0.15);
    --price-red: #ff4d4d;
  }

  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .timeline-container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .event-card { 
    background: var(--surface); border-radius: 24px; overflow: hidden; 
    display: flex; text-decoration: none; color: inherit; 
    box-shadow: 0 4px 20px rgba(168, 127, 232, 0.08); 
    transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent;
  }
  .event-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(168, 127, 232, 0.15); }

  .img-container { width: 220px; height: 220px; position: relative; flex-shrink: 0; background: #eee; }
  .event-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
  .event-img.active { opacity: 1; }

  .event-info { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
  
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .member-tag { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  
  /* Titles stacked together */
  .title-group { margin-bottom: 12px; }
  .event-title { font-family: 'Playfair Display', serif; font-size: 22px; line-height: 1.2; margin: 0 0 4px 0; color: var(--text); }
  
  .details-list { font-size: 14px; opacity: 0.8; line-height: 1.6; margin-bottom: 15px; }
  .dress-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .dress-tag { background: #f0f0f0; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }

  .status-row { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .price-val { color: var(--price-red); font-weight: 700; font-size: 15px; }
  
  .countdown-box { text-align: right; }
  .timer-text { display: block; font-size: 11px; font-weight: 600; color: var(--theme-purple); margin-bottom: 4px; text-transform: uppercase; }
  .badge { padding: 4px 12px; border-radius: 100px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
  .badge-soon { background: #eef5ff; color: #4b92ff; }
  .badge-ended { background: #f5f5f5; color: #999; }

  @media (max-width: 600px) {
    .event-card { flex-direction: column; }
    .img-container { width: 100%; height: 200px; }
  }
</style>
</head>
<body>

<div class="timeline-container" id="timeline-root"></div>

<script>
  const SPREADSHEET_ID = '2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW';
  const GID = '1296117535';
  const DETAIL_URL = 'details.html';

  const memberStyles = {
    "Yejun": { bg: "#eef5ff", text: "#4B92FF", border: "#4B92FF" },
    "Noah": { bg: "#f5f0ff", text: "#A076FF", border: "#A076FF" },
    "Bamby": { bg: "#fff0f6", text: "#FF7EB3", border: "#FF7EB3" },
    "Eunho": { bg: "#fff0f0", text: "#FF4D4D", border: "#FF4D4D" },
    "Hamin": { bg: "#e9f9ee", text: "#2ECC71", border: "#2ECC71" },
    "PLAVE": { bg: "#7a4ed9", text: "#ffffff", border: "#7a4ed9" }
  };

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    if (min === max) return `₱${Number(min).toLocaleString()}`;
    return `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  function getCountdown(date) {
    const diff = new Date(date) - new Date();
    if (diff < 0) return "";
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    return days > 0 ? `${days}d ${hours}h left` : `${hours}h left`;
  }

  async function init() {
    try {
      const response = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${GID}&single=true&output=csv`);
      const csv = await response.text();
      const rows = csv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim())).slice(1);

      const now = new Date();
      const container = document.getElementById('timeline-root');
      
      container.innerHTML = rows.map(r => {
        const startDate = new Date(r[0]);
        const isPast = startDate < now;
        const titles = r[2].split(',');
        const images = r[6].split(',');
        const members = (r[13] || "").split(',').filter(Boolean);
        const primaryMember = members[0]?.trim();
        const mStyle = memberStyles[primaryMember] || memberStyles["PLAVE"];
        
        const memberTags = members.map(m => {
          const s = memberStyles[m.trim()] || memberStyles["PLAVE"];
          return `<div class="member-tag" style="background:${s.bg}; color:${s.text}; border: 1px solid ${s.border}44;">✦ ${m.trim()}</div>`;
        }).join('');

        const titleHtml = titles.map(t => `<h2 class="event-title">${t.trim()}</h2>`).join('');

        return `
          <a href="${DETAIL_URL}?id=${r[12]}" class="event-card" style="border-color: ${mStyle.border}; border-width: 2.5px;">
            <div class="img-container">
              ${images.map((img, i) => `<img src="${img.trim()}" class="event-img ${i===0?'active':''}" id="img-${r[12]}-${i}">`).join('')}
            </div>
            <div class="event-info">
              <div class="tag-row">${memberTags}</div>
              <div class="title-group">${titleHtml}</div>
              <div class="details-list">
                <div>📅 ${startDate.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})} ${r[3] ? ' • ⏰ ' + r[3] : ''}</div>
                <div>📍 ${r[5]}</div>
                ${r[10] ? `<div class="dress-row">${r[10].split(',').map(d => `<span class="dress-tag">👗 ${d.trim()}</span>`).join('')}</div>` : ''}
              </div>
              <div class="status-row">
                <div class="price-val">${formatPrice(r[8], r[9])}</div>
                <div class="countdown-box">
                  ${!isPast ? `<span class="timer-text">${getCountdown(startDate)}</span>` : ''}
                  <span class="badge ${isPast ? 'badge-ended' : 'badge-soon'}">${isPast ? 'ENDED' : 'SOON'}</span>
                </div>
              </div>
            </div>
          </a>
        `;
      }).join('');

      rows.forEach(r => {
        const images = r[6].split(',');
        if (images.length > 1) {
          let currentIdx = 0;
          setInterval(() => {
            const currentImg = document.getElementById(`img-${r[12]}-${currentIdx}`);
            if (currentImg) currentImg.classList.remove('active');
            currentIdx = (currentIdx + 1) % images.length;
            const nextImg = document.getElementById(`img-${r[12]}-${currentIdx}`);
            if (nextImg) nextImg.classList.add('active');
          }, 3000);
        }
      });

    } catch (err) {
      console.error(err);
      document.getElementById('timeline-root').innerHTML = "Error loading events.";
    }
  }
  init();
</script>
</body>
</html>
