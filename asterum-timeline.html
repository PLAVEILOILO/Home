<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asterum Timeline | PLAVE Iloilo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --border: rgba(180,160,220,0.2);
    --text: #1e1530; --theme-purple: #a87fe8; --accent: #6c5ce7;
    --price-red: #ff4d4d;
  }

  body {
    font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
  }

  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); width: 400px; height: 400px; opacity: 0.3; }
  .orb-1 { background: #ddd0fa; top: -10%; left: -10%; }
  .orb-2 { background: #fbd5e8; bottom: -5%; right: -5%; }

  /* Restored Header */
  header { text-align: center; margin: 40px 0 30px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 42px; margin: 0; color: var(--text); }
  header p { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; margin-top: 5px; }

  /* Restored Dual/Triple Filter Section */
  .filter-section { 
    width: min(900px, 100%); display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
    gap: 15px; margin-bottom: 30px; 
  }
  .filter-box { background: white; padding: 12px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border); }
  .filter-box label { font-size: 10px; font-weight: 800; text-transform: uppercase; opacity: 0.4; color: var(--theme-purple); }
  .filter-box select { border: none; font-family: 'Outfit'; font-weight: 600; font-size: 14px; outline: none; background: transparent; color: var(--text); cursor: pointer; appearance: none; }

  /* Centered Timeline Container */
  .timeline { width: min(900px, 100%); display: flex; flex-direction: column; gap: 20px; }
  
  /* Restored Event Card Layout */
  .event-card {
    background: var(--surface); border-radius: 24px; display: grid;
    grid-template-columns: 220px 1fr; border: 2.5px solid transparent;
    overflow: hidden; transition: all 0.2s; text-decoration: none; color: inherit;
    box-shadow: 0 4px 20px rgba(168, 127, 232, 0.08);
  }
  .event-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(168, 127, 232, 0.15); }

  .img-container { position: relative; width: 220px; height: 220px; overflow: hidden; background: #eee; flex-shrink: 0; }
  .event-img { 
    position: absolute; width: 100%; height: 100%; object-fit: cover; 
    transition: opacity 0.8s ease-in-out; opacity: 0;
  }
  .event-img.active { opacity: 1; }

  .event-info { padding: 25px; display: flex; flex-direction: column; min-width: 0; }
  
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cat-tag { background: #f3edff; color: var(--theme-purple); padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .member-tag { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; border: 1px solid rgba(0,0,0,0.05); }

  .title-group { margin-bottom: 12px; }
  .event-title { font-family: 'Playfair Display', serif; font-size: 22px; line-height: 1.2; margin: 0 0 4px 0; color: var(--text); }
  .title-divider { height: 1px; background: var(--border); border: none; margin: 8px 0; }

  .details-list { font-size: 14px; opacity: 0.8; line-height: 1.6; margin-bottom: 15px; display: flex; flex-direction: column; gap: 4px; }
  
  .status-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 15px; border-top: 1px dashed var(--border); }
  .price-val { color: var(--price-red); font-weight: 700; font-size: 15px; }
  
  .badge { padding: 4px 12px; border-radius: 100px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
  .badge-soon { background: #eef5ff; color: #4b92ff; }
  .badge-ended { background: #f5f5f5; color: #999; }

  #backToTop { position: fixed; bottom: 30px; right: 30px; width: 45px; height: 45px; border-radius: 50%; background: var(--accent); color: white; border: none; cursor: pointer; display: none; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

  @media (max-width: 600px) {
    .event-card { grid-template-columns: 1fr; }
    .img-container { width: 100%; height: 220px; }
    header h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header>
  <h1>Asterum</h1>
  <p>Timeline & Event Archive</p>
</header>

<div class="filter-section">
  <div class="filter-box">
    <label>Timeline</label>
    <select id="timeFilter" onchange="renderTimeline()"><option value="all">All Events</option><option value="upcoming">Upcoming</option><option value="past">Past</option></select>
  </div>
  <div class="filter-box">
    <label>Category</label>
    <select id="catFilter" onchange="renderTimeline()"><option value="all">All Categories</option></select>
  </div>
  <div class="filter-box">
    <label>Sort Order</label>
    <select id="sortOrder" onchange="renderTimeline()"><option value="desc">Latest First</option><option value="asc">Earliest First</option></select>
  </div>
</div>

<div class="timeline" id="timelineContainer"></div>
<button id="backToTop" onclick="scrollToTop()">↑</button>

<script>
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];

  const memberStyles = {
    "Yejun": { border: "#4B92FF", bg: "#eef5ff", text: "#4B92FF" },
    "Noah": { border: "#A076FF", bg: "#f5f0ff", text: "#A076FF" },
    "Bamby": { border: "#FF7EB3", bg: "#fff0f6", text: "#FF7EB3" },
    "Eunho": { border: "#FF4D4D", bg: "#fff0f0", text: "#FF4D4D" },
    "Hamin": { border: "#2ECC71", bg: "#e9f9ee", text: "#2ECC71" },
    "PLAVE": { border: "#a87fe8", bg: "#f3edff", text: "#a87fe8" }
  };

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    return min === max ? `₱${Number(min).toLocaleString()}` : `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  async function init() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim()))
        .filter(row => row.length > 5 && row[0] !== "Start Date");

      allEvents = rows.map(row => ({
        start: new Date(row[0]),
        titles: (row[2] || "").split(','),
        startTime: row[3] || "",
        loc: row[5] || "TBA", 
        imgs: (row[6] || "").split(','),
        cat: row[7] || "Event",
        minP: row[8], maxP: row[9],
        id: row[12],
        members: (row[13] || "").split(',').filter(Boolean)
      }));

      const cats = [...new Set(allEvents.map(e => e.cat.trim()))];
      const catSelect = document.getElementById('catFilter');
      cats.forEach(c => { if(c){ const opt = document.createElement('option'); opt.value = c; opt.textContent = c; catSelect.appendChild(opt); }});

      renderTimeline();
    } catch (e) { console.error(e); }
  }

  function renderTimeline() {
    const timeVal = document.getElementById('timeFilter').value;
    const catVal = document.getElementById('catFilter').value;
    const sortVal = document.getElementById('sortOrder').value;
    const container = document.getElementById('timelineContainer');
    const now = new Date(); now.setHours(0,0,0,0);

    let filtered = allEvents.filter(ev => {
      const isPast = ev.start < now;
      const timeMatch = (timeVal === 'all') || (timeVal === 'past' && isPast) || (timeVal === 'upcoming' && !isPast);
      return timeMatch && (catVal === 'all' || ev.cat === catVal);
    });

    filtered.sort((a, b) => sortVal === 'asc' ? a.start - b.start : b.start - a.start);

    container.innerHTML = filtered.map(ev => {
      const isPast = ev.start < now;
      const mStyle = memberStyles[ev.members[0]?.trim()] || memberStyles["PLAVE"];
      
      return `
        <a href="details.html?id=${ev.id}" class="event-card" style="border-color: ${mStyle.border}">
          <div class="img-container">
            ${ev.imgs.map((img, i) => `<img src="${img.trim()}" class="event-img ${i===0?'active':''}" id="img-${ev.id}-${i}">`).join('')}
          </div>
          <div class="event-info">
            <div class="tag-row">
              <div class="cat-tag">${ev.cat}</div>
              ${ev.members.map(m => {
                const s = memberStyles[m.trim()] || memberStyles["PLAVE"];
                return `<div class="member-tag" style="background:${s.bg}; color:${s.text}">✦ ${m.trim()}</div>`;
              }).join('')}
            </div>
            <div class="title-group">${ev.titles.map((t, i) => `<h2 class="event-title">${t.trim()}</h2>${i < ev.titles.length - 1 ? '<hr class="title-divider">' : ''}`).join('')}</div>
            <div class="details-list">
              <div>📅 ${ev.start.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})} ${ev.startTime ? ' • ⏰ ' + ev.startTime : ''}</div>
              <div>📍 ${ev.loc}</div>
            </div>
            <div class="status-row">
              <div class="price-val">🎟️ ${formatPrice(ev.minP, ev.maxP)}</div>
              <span class="badge ${isPast ? 'badge-ended' : 'badge-soon'}">${isPast ? 'ENDED' : 'SOON'}</span>
            </div>
          </div>
        </a>`;
    }).join('');

    startImageSwiper(filtered);
  }

  function startImageSwiper(events) {
    events.forEach(ev => {
      if (ev.imgs.length > 1) {
        let cur = 0;
        setInterval(() => {
          const cImg = document.getElementById(`img-${ev.id}-${cur}`);
          if (cImg) cImg.classList.remove('active');
          cur = (cur + 1) % ev.imgs.length;
          const nImg = document.getElementById(`img-${ev.id}-${cur}`);
          if (nImg) nImg.classList.add('active');
        }, 3000);
      }
    });
  }

  window.onscroll = () => { document.getElementById('backToTop').style.display = window.scrollY > 300 ? 'block' : 'none'; };
  function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  
  init();
</script>
</body>
</html>
