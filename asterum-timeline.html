<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asterum Timeline | PLAVE Iloilo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --border: rgba(180,160,220,0.2);
    --text: #1e1530; --theme-purple: #a87fe8; --accent: #6c5ce7;
  }

  body {
    font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
  }

  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); width: 400px; height: 400px; opacity: 0.3; }
  .orb-1 { background: #ddd0fa; top: -10%; left: -10%; }
  .orb-2 { background: #fbd5e8; bottom: -5%; right: -5%; }

  header { text-align: center; margin: 20px 0 10px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 8vw, 38px); margin: 0; }

  .filter-bar { 
    width: min(850px, 100%); 
    display: flex; 
    justify-content: center; 
    gap: 12px; 
    margin-bottom: 30px; 
    padding: 10px; 
    flex-wrap: wrap;
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; max-width: 200px; }
  .filter-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--theme-purple); padding-left: 5px; }

  select {
    padding: 10px 15px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface); font-family: inherit; font-size: 13px; color: var(--text);
    outline: none; cursor: pointer; appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a87fe8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 16px; padding-right: 35px;
  }

  .timeline { width: min(800px, 100%); display: flex; flex-direction: column; gap: 20px; }
  .event-link { text-decoration: none; color: inherit; display: block; width: 100%; }
  .event-card {
    background: var(--surface); border-radius: 24px; display: grid;
    grid-template-columns: 180px 1fr; border: 1px solid var(--border);
    overflow: hidden; transition: transform 0.2s;
  }
  .event-card:hover { transform: translateY(-3px); }
  .event-img { width: 100%; height: 100%; object-fit: cover; }
  .event-info { padding: 24px; display: flex; flex-direction: column; min-width: 0; }
  
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .category-tag { 
    padding: 4px 10px; border-radius: 6px; font-size: 10px; 
    font-weight: 700; text-transform: uppercase;
  }

  .event-title { margin: 0 0 10px 0; font-size: 20px; line-height: 1.2; }
  .details-list { font-size: 13px; opacity: 0.8; display: flex; flex-direction: column; gap: 6px; }
  .loc-link { text-decoration: none; color: inherit; font-weight: 500; }
  .loc-link:hover { color: var(--theme-purple); text-decoration: underline; }

  .dress-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .dress-chip { 
    background: #f0f0f0; color: #666; padding: 2px 8px; border-radius: 100px; 
    font-size: 10px; font-weight: 600; text-transform: uppercase; border: 1px solid var(--border);
  }

  .status-row { 
    display: flex; justify-content: space-between; align-items: flex-end; 
    margin-top: auto; padding-top: 15px; border-top: 1px dashed var(--border); 
  }
  .meta-item { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .badge-group { text-align: right; }
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; display: inline-block; }
  .badge-soon { background: var(--theme-purple); color: white; }
  .badge-ended { background: #eee; color: #888; }
  .countdown { font-size: 11px; font-weight: 500; color: var(--theme-purple); display: block; margin-top: 4px; }

  #backToTop {
    position: fixed; bottom: 30px; right: 30px; width: 45px; height: 45px; 
    border-radius: 50%; background: var(--accent); color: white; border: none;
    cursor: pointer; display: none; z-index: 1000; font-size: 18px;
  }

  @media (max-width: 600px) {
    .event-card { grid-template-columns: 1fr; }
    .event-img { height: 160px; }
    .filter-group { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<header>
  <h1>Asterum <em>Timeline</em></h1>
</header>

<div class="filter-bar">
  <div class="filter-group">
    <label class="filter-label">Timeline</label>
    <select id="timeFilter" onchange="filterEvents()">
      <option value="all">All Events</option>
      <option value="upcoming">Upcoming</option>
      <option value="past">Past</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label">Category</label>
    <select id="catFilter" onchange="filterEvents()">
      <option value="all">All Categories</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label">Order</label>
    <select id="sortOrder" onchange="filterEvents()">
      <option value="asc">Oldest First</option>
      <option value="desc">Newest First</option>
    </select>
  </div>
</div>

<div class="timeline" id="timelineContainer"></div>
<button id="backToTop" onclick="scrollToTop()">↑</button>

<script>
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW/pub?gid=1296117535&single=true&output=csv';
  let allEvents = [];

  const catColors = {
    "Anniversary": { bg: "#fff0f6", text: "#d63384" },
    "Birthdays": { bg: "#fff9db", text: "#f59f00" },
    "Online Viewing": { bg: "#e7f5ff", text: "#1c7ed6" },
    "Fan Gathering": { bg: "#f3edff", text: "#a87fe8" }
  };
  const defaultColor = { bg: "#f3edff", text: "#a87fe8" };

  window.onscroll = function() {
    const btn = document.getElementById("backToTop");
    if (document.documentElement.scrollTop > 400) btn.style.display = "block";
    else btn.style.display = "none";
  };
  function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

  async function loadTimeline() {
    try {
      const response = await fetch(sheetUrl);
      const csv = await response.text();
      const rows = csv.split(/\r?\n/)
        .map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim()))
        .filter(row => row.length > 5 && row[0] !== "Start Date");

      allEvents = rows.map(row => {
        const start = new Date(row[0]);
        const end = row[1] ? new Date(row[1]) : null;
        return {
          start: start,
          end: end,
          title: row[2] || "Untitled",
          startTime: row[3] || "", 
          endTime: row[4] || "",
          loc: row[5] || "TBA", 
          img: row[6] || "", 
          cat: row[7] || "Event",
          minP: row[8] || "0", 
          maxP: row[9] || "0", 
          dress: row[10] || "",
          locLink: row[11] || "",
          id: row[12] || ""
        };
      });

      // Populate Categories Dropdown
      const allCats = allEvents.flatMap(e => e.cat.split(',').map(c => c.trim()));
      const uniqueCats = [...new Set(allCats)].filter(Boolean);
      const catSelect = document.getElementById('catFilter');
      uniqueCats.forEach(c => { 
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });

      filterEvents();
    } catch (e) { document.getElementById('timelineContainer').innerHTML = "Error loading Asterum."; }
  }

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free";
    if (min === max) return `₱${Number(min).toLocaleString()}`;
    return `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  function filterEvents() {
    const timeVal = document.getElementById('timeFilter').value;
    const catVal = document.getElementById('catFilter').value;
    const sortVal = document.getElementById('sortOrder').value;
    const container = document.getElementById('timelineContainer');
    const now = new Date(); now.setHours(0,0,0,0);

    // 1. Filter Logic
    let filtered = allEvents.filter(ev => {
      const isPast = (ev.end || ev.start) < now;
      const timeMatch = (timeVal === 'all') || (timeVal === 'past' && isPast) || (timeVal === 'upcoming' && !isPast);
      
      const evCats = ev.cat.split(',').map(c => c.trim());
      const catMatch = (catVal === 'all') || (evCats.includes(catVal));
      
      return timeMatch && catMatch;
    });

    // 2. Sort Logic
    filtered.sort((a, b) => {
        return sortVal === 'asc' ? a.start - b.start : b.start - a.start;
    });

    // 3. Render HTML
    container.innerHTML = filtered.map(ev => {
      const diffDays = Math.ceil((ev.start - now) / (1000 * 60 * 60 * 24));
      const isPast = (ev.end || ev.start) < now;
      
      let statusBadge = isPast ? '<span class="badge badge-ended">ENDED</span>' : '<span class="badge badge-soon">SOON</span>';
      let countdownText = (diffDays === 0) ? "Happening Today!" : (diffDays === 1) ? "Tomorrow!" : (diffDays > 1) ? `In ${diffDays} days` : "";

      let dateString = ev.start.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      if (ev.end && ev.end.getTime() !== ev.start.getTime()) {
        const sameMonth = ev.start.getMonth() === ev.end.getMonth();
        if (sameMonth) {
          dateString = `${ev.start.toLocaleString('en-US', { month: 'long' })} ${ev.start.getDate()}–${ev.end.getDate()}, ${ev.start.getFullYear()}`;
        } else {
          dateString = `${ev.start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${ev.end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
        }
      }

      const categories = ev.cat.split(',').map(c => c.trim()).filter(Boolean);
      const categoryChips = categories.map(cat => {
          const colors = catColors[cat] || defaultColor;
          return `<div class="category-tag" style="background: ${colors.bg}; color: ${colors.text};">${cat}</div>`;
      }).join('');

      const dressChips = ev.dress ? ev.dress.split(',').map(item => `<span class="dress-chip">${item.trim()}</span>`).join('') : '';
      const locationDisplay = ev.locLink ? `<a href="${ev.locLink}" target="_blank" class="loc-link" onclick="event.stopPropagation()">📍 ${ev.loc}</a>` : `📍 ${ev.loc}`;

      const cardHtml = `
        <div class="event-card">
          <img src="${ev.img}" class="event-img" loading="lazy" onerror="this.style.display='none'">
          <div class="event-info">
            <div class="tag-row">
              ${categoryChips}
            </div>
            <h2 class="event-title">${ev.title}</h2>
            <div class="details-list">
              <div>📅 ${dateString}</div>
              <div>${locationDisplay}</div>
              ${ev.dress ? `<div class="dress-row">👚 ${dressChips}</div>` : ''}
            </div>
            <div class="status-row">
              <div class="meta-group">
                ${ev.startTime ? `<div class="meta-item" style="color: #2E2E2E;">⏰ ${ev.startTime}${ev.endTime ? ' – ' + ev.endTime : ''}</div>` : ''}
                <div class="meta-item" style="color: #963252;">🎟️ ${formatPrice(ev.minP, ev.maxP)}</div>
              </div>
              <div class="badge-group">
                ${statusBadge}
                <span class="countdown">${isPast ? '' : countdownText}</span>
              </div>
            </div>
          </div>
        </div>`;

      return ev.id ? `<a href="details.html?id=${encodeURIComponent(ev.id)}" class="event-link">${cardHtml}</a>` : cardHtml;
    }).join('');

    if(filtered.length === 0) container.innerHTML = '<p style="text-align:center; opacity:0.5; margin-top:40px;">No cosmic events found.</p>';
  }
  loadTimeline();
</script>
</body>
</html>
