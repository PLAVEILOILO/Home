<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asterum | Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7ff; --surface: #ffffff; --text: #1e1530;
    --theme-purple: #a87fe8; --accent: #6c5ce7; --border: rgba(180,160,220,0.15);
    --price-red: #ff4d4d;
  }

  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }

  /* Page Header */
  header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 42px; margin: 0; color: var(--text); }
  header p { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; margin-top: 5px; }

  /* Double Filters */
  .filter-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
  .filter-box { background: white; padding: 12px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 4px; }
  .filter-box label { font-size: 10px; font-weight: 800; text-transform: uppercase; opacity: 0.4; }
  .filter-box select { border: none; font-family: 'Outfit'; font-weight: 600; font-size: 14px; outline: none; background: transparent; color: var(--text); cursor: pointer; }

  .timeline-container { display: flex; flex-direction: column; gap: 20px; }

  .event-card { 
    background: var(--surface); border-radius: 24px; overflow: hidden; 
    display: flex; text-decoration: none; color: inherit; 
    box-shadow: 0 4px 20px rgba(168, 127, 232, 0.08); 
    transition: transform 0.2s, box-shadow 0.2s; border: 2.5px solid transparent;
  }
  .event-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(168, 127, 232, 0.15); }

  .img-container { width: 220px; height: 220px; position: relative; flex-shrink: 0; background: #eee; }
  .event-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
  .event-img.active { opacity: 1; }

  .event-info { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
  
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .member-tag { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .cat-tag { background: #f3edff; color: var(--theme-purple); padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  
  .title-group { margin-bottom: 12px; }
  .event-title { font-family: 'Playfair Display', serif; font-size: 22px; line-height: 1.2; margin: 0 0 4px 0; color: var(--text); }
  
  .details-list { font-size: 14px; opacity: 0.8; line-height: 1.6; margin-bottom: 15px; }
  .dress-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .dress-tag { background: #f0f0f0; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }

  .status-row { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .price-val { color: var(--price-red); font-weight: 700; font-size: 15px; }
  
  .badge { padding: 4px 12px; border-radius: 100px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
  .badge-soon { background: #eef5ff; color: #4b92ff; }
  .badge-ended { background: #f5f5f5; color: #999; }

  @media (max-width: 600px) {
    .event-card { flex-direction: column; }
    .img-container { width: 100%; height: 200px; }
    .filter-section { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Asterum</h1>
    <p>Timeline & Event Archive</p>
  </header>

  <div class="filter-section">
    <div class="filter-box">
      <label>Category</label>
      <select id="filterCat" onchange="renderTimeline()">
        <option value="all">All Events</option>
      </select>
    </div>
    <div class="filter-box">
      <label>Order By</label>
      <select id="sortDate" onchange="renderTimeline()">
        <option value="new">Newest Added</option>
        <option value="old">Oldest Added</option>
      </select>
    </div>
  </div>

  <div class="timeline-container" id="timeline-root"></div>
</div>

<script>
  const SPREADSHEET_ID = '2PACX-1vT3T18h7TYjysdK7Dkguh_k7Q3j9qTQFsMSzrw8jqonpsPn0Re-I7F5t6TEP9RPtBD2labTVj5l0cjW';
  const GID = '1296117535';
  
  let allEvents = [];

  const memberStyles = {
    "Yejun": { bg: "#eef5ff", text: "#4B92FF", border: "#4B92FF" },
    "Noah": { bg: "#f5f0ff", text: "#A076FF", border: "#A076FF" },
    "Bamby": { bg: "#fff0f6", text: "#FF7EB3", border: "#FF7EB3" },
    "Eunho": { bg: "#fff0f0", text: "#FF4D4D", border: "#FF4D4D" },
    "Hamin": { bg: "#e9f9ee", text: "#2ECC71", border: "#2ECC71" },
    "PLAVE": { bg: "#7a4ed9", text: "#ffffff", border: "#7a4ed9" }
  };

  function formatPrice(min, max) {
    if (!min || min === "0" || min.toLowerCase() === "free") return "Free Access";
    return min === max ? `₱${Number(min).toLocaleString()}` : `₱${Number(min).toLocaleString()} - ₱${Number(max).toLocaleString()}`;
  }

  async function fetchEvents() {
    try {
      const response = await fetch(`https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${GID}&single=true&output=csv`);
      const csv = await response.text();
      allEvents = csv.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim())).slice(1);
      
      const cats = new Set();
      allEvents.forEach(r => r[7].split(',').forEach(c => c.trim() && cats.add(c.trim())));
      const catSelect = document.getElementById('filterCat');
      cats.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);
      
      renderTimeline();
    } catch (e) { console.error(e); }
  }

  function renderTimeline() {
    const now = new Date();
    const sortVal = document.getElementById('sortDate').value;
    const catVal = document.getElementById('filterCat').value;
    
    let filtered = allEvents.filter(r => catVal === 'all' || r[7].includes(catVal));
    filtered.sort((a, b) => sortVal === 'new' ? new Date(b[0]) - new Date(a[0]) : new Date(a[0]) - new Date(b[0]));

    const container = document.getElementById('timeline-root');
    container.innerHTML = filtered.map(r => {
      const startDate = new Date(r[0]);
      const isPast = startDate < now;
      const titles = r[2].split(',');
      const images = r[6].split(',');
      const categories = r[7].split(',').filter(Boolean);
      const members = (r[13] || "").split(',').filter(Boolean);
      const mStyle = memberStyles[members[0]?.trim()] || memberStyles["PLAVE"];
      
      return `
        <a href="details.html?id=${r[12]}" class="event-card" style="border-color: ${mStyle.border};">
          <div class="img-container">
            ${images.map((img, i) => `<img src="${img.trim()}" class="event-img ${i===0?'active':''}" id="img-${r[12]}-${i}">`).join('')}
          </div>
          <div class="event-info">
            <div class="tag-row">
              ${categories.map(c => `<div class="cat-tag">${c.trim()}</div>`).join('')}
              ${members.map(m => {
                const s = memberStyles[m.trim()] || memberStyles["PLAVE"];
                return `<div class="member-tag" style="background:${s.bg}; color:${s.text}; border:1px solid ${s.border}44">✦ ${m.trim()}</div>`;
              }).join('')}
            </div>
            <div class="title-group">${titles.map(t => `<h2 class="event-title">${t.trim()}</h2>`).join('')}</div>
            <div class="details-list">
              <div>📅 ${startDate.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})} ${r[3] ? ' • ⏰ ' + r[3] : ''}</div>
              <div>📍 ${r[5]}</div>
              ${r[10] ? `<div class="dress-row">${r[10].split(',').map(d => `<span class="dress-tag">👗 ${d.trim()}</span>`).join('')}</div>` : ''}
            </div>
            <div class="status-row">
              <div class="price-val">🎟️ ${formatPrice(r[8], r[9])}</div>
              <span class="badge ${isPast ? 'badge-ended' : 'badge-soon'}">${isPast ? 'ENDED' : 'SOON'}</span>
            </div>
          </div>
        </a>
      `;
    }).join('');

    // Re-init image slideshows
    filtered.forEach(r => {
      const imgs = r[6].split(',');
      if (imgs.length > 1) {
        let cur = 0;
        setInterval(() => {
          const cImg = document.getElementById(`img-${r[12]}-${cur}`);
          if (cImg) cImg.classList.remove('active');
          cur = (cur + 1) % imgs.length;
          const nImg = document.getElementById(`img-${r[12]}-${cur}`);
          if (nImg) nImg.classList.add('active');
        }, 3000);
      }
    });
  }

  fetchEvents();
</script>
</body>
</html>
