<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLI Anniversary Pass ✨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(175deg, #fffbe6 0%, #fff8f0 55%, #fff0f5 100%);
            overflow-x: hidden;
        }

        #daisy-canvas { position: fixed; inset: 0; pointer-events: none; opacity: 0.5; z-index: 0; }

        /* --- Registration Card --- */
        .card {
            background: rgba(255,255,255,0.92);
            padding: 40px; border-radius: 40px;
            box-shadow: 0 10px 40px rgba(255,210,80,0.15);
            width: 90%; max-width: 400px; text-align: center;
            position: relative; z-index: 10; backdrop-filter: blur(8px);
            border: 2px solid #fde68a;
        }

        input {
            width: 100%; padding: 14px; margin: 10px 0;
            border: 2px solid #fde68a; border-radius: 15px;
            font-family: 'Fredoka'; font-size: 16px; outline: none;
        }

        .btn {
            width: 100%; padding: 16px; margin-top: 15px;
            background: linear-gradient(135deg, #ffd54f 0%, #f48fb1 100%);
            color: white; border: none; border-radius: 20px;
            font-family: 'Fredoka'; font-weight: 600; cursor: pointer;
        }

        /* --- Ticket Styles --- */
        #ticket-container { display: none; width: 90%; max-width: 450px; z-index: 10; }
        
        .success-msg {
            background: #f0fdf4; color: #166534; padding: 12px;
            border-radius: 15px; margin-bottom: 15px; font-size: 14px;
            font-weight: 600; text-align: center; border: 1px solid #bbf7d0;
        }

        #capture-area { border-radius: 30px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }

        .ticket {
            width: 100%; height: 600px; position: relative;
            background: var(--m-bg); display: flex; flex-direction: column;
        }

        .member-img {
            position: absolute; inset: 0;
            background-size: cover; background-position: center 10%;
        }

        .badge-sticker {
            position: absolute; top: 25px; right: 25px;
            width: 80px; height: 80px; background: #72c95e; color: white;
            border-radius: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Fredoka'; font-weight: 600; font-size: 10px;
            border: 3px dashed rgba(255,255,255,0.5);
            transform: rotate(15deg) scale(0); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .badge-sticker.pop { transform: rotate(15deg) scale(1); }

        .fade-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, var(--m-bg) 0%, var(--m-bg) 35%, transparent 70%);
        }

        .ticket-content { position: relative; z-index: 5; margin-top: auto; padding: 35px; }

        .detail-label { font-size: 10px; text-transform: uppercase; color: #d4860f; letter-spacing: 1px; }
        .detail-value { font-size: 15px; font-weight: 600; color: #7a4020; margin-bottom: 10px; }
        #display-name { font-size: 32px; font-weight: 800; font-family: 'Fredoka'; color: #7a4020; margin: 0; }

        .dl-btn {
            width: 100%; padding: 18px; background: #e8822a; color: white;
            border: none; border-radius: 20px; font-family: 'Fredoka';
            font-weight: 600; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

<canvas id="daisy-canvas"></canvas>

<!-- FORM SECTION -->
<div id="form-container" class="card">
    <h2 style="font-family: 'Fredoka'; color: #e8822a; margin: 0;">PLLIcnic 🧺</h2>
    <p style="font-size: 12px; color: #c96a1a; letter-spacing: 2px;">ANNIVERSARY EVENT</p>
    <input type="text" id="firstName" placeholder="First Name">
    <input type="text" id="lastName" placeholder="Last Name">
    <button class="btn" onclick="register()">Get My Ticket 🎟️</button>
</div>

<!-- TICKET SECTION -->
<div id="ticket-container">
    <div class="success-msg">✨ Registration Confirmed! ✨</div>
    <div id="capture-area">
        <div id="ticket-body" class="ticket">
            <div id="badge" class="badge-sticker"><span>PLLI</span><b>Certified</b></div>
            <div id="member-photo" class="member-img"></div>
            <div class="fade-overlay"></div>
            <div class="ticket-content">
                <div id="member-tag" style="background: white; padding: 4px 12px; border-radius: 20px; display: inline-block; font-size: 11px; font-weight: 600; margin-bottom: 10px;">✦ MEMBER</div>
                <div style="font-family: 'Montserrat'; font-size: 22px; color: #7a4020; margin-bottom: 15px;">PICNIC PASS</div>
                <div style="display: flex; gap: 40px;">
                    <div><div class="detail-label">Pass ID</div><div id="ticket-id" class="detail-value">---</div></div>
                    <div><div class="detail-label">Date</div><div class="detail-value">June 20, 2026</div></div>
                </div>
                <div style="border-top: 1px solid rgba(0,0,0,0.1); padding-top: 15px;">
                    <div class="detail-label">Authorized PLLI</div>
                    <h1 id="display-name">---</h1>
                </div>
            </div>
        </div>
    </div>
    <button class="dl-btn" onclick="downloadTicket()">Download Pass 📸</button>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfFoSMdou6RTF1yoTpnAwWA54QY6CkVMaodbKgcKzDC9sos6shLKUm0O3EzFg45Kv5/exec';

    const memberData = {
        "Yejun": { bg: "#c2e0f9", color: "#1f618d", img: "https://i.postimg.cc/kX4pLqRj/yejun.png" },
        "Noah":  { bg: "#e6cef7", color: "#6c3483", img: "https://i.postimg.cc/mD8XyZzG/noah.png" },
        "Bamby": { bg: "#ffdde6", color: "#b02c61", img: "https://i.postimg.cc/7Z9Y3q7p/bamby.png" },
        "Eunho": { bg: "#ffdad6", color: "#b72a27", img: "https://i.postimg.cc/G29x9v6t/eunho.png" },
        "Hamin": { bg: "#d9f2d1", color: "#236026", img: "https://i.postimg.cc/3Rz0Xw8V/hamin.png" },
        "PLAVE (Group)": { bg: "#fff3d6", color: "#e8799e", img: "https://i.postimg.cc/mD8XyZzG/noah.png" }
    };

    async function register() {
        const first = document.getElementById('firstName').value.trim();
        const last = document.getElementById('lastName').value.trim();
        if(!first || !last) return alert("Please enter your name!");

        const btn = document.querySelector('.btn');
        btn.innerText = "Processing..."; btn.disabled = true;

        try {
            // Using 'cors' mode to ensure we get the data back. 
            // Note: If you get a CORS error, your Apps Script Deployment "Who has access" isn't set to "Anyone".
            const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ first, last })
            });
            const result = await response.json();
            
            showTicket(first, result.member, result.passId);
        } catch (e) {
            console.error(e);
            // Fallback for testing
            showTicket(first, "PLAVE (Group)", "PLLI-LOCAL");
        }
    }

    function showTicket(name, member, id) {
        const data = memberData[member] || memberData["PLAVE (Group)"];
        const ticket = document.getElementById('ticket-body');
        
        ticket.style.setProperty('--m-bg', data.bg);
        document.getElementById('member-photo').style.backgroundImage = `url(${data.img})`;
        document.getElementById('member-tag').innerText = `✦ ${member.toUpperCase()}`;
        document.getElementById('member-tag').style.color = data.color;
        document.getElementById('display-name').innerText = name.toUpperCase();
        document.getElementById('ticket-id').innerText = id;

        document.getElementById('form-container').style.display = 'none';
        document.getElementById('ticket-container').style.display = 'block';

        setTimeout(() => {
            document.getElementById('badge').classList.add('pop');
        }, 500);
    }

    function downloadTicket() {
        html2canvas(document.querySelector("#capture-area"), { useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'PLLIcnic_Pass.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    // Daisy animation code... (keeping it simple)
    const canvas = document.getElementById('daisy-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(100, 100, 5, 0, Math.PI*2); ctx.fill(); // Demo dot
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
