<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLIcnic Anniversary ✨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap');

        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            margin: 0; padding: 20px; overflow-x: hidden;
            background: linear-gradient(175deg, #fffbe6 0%, #fff8f0 55%, #fff0f5 100%);
        }

        #daisy-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.6; }

        /* --- Glassmorphism Card --- */
        .card {
            background: rgba(255,255,255,0.85);
            padding: 40px; border-radius: 40px;
            box-shadow: 0 15px 50px rgba(255,210,80,0.2);
            width: 100%; max-width: 420px; text-align: center;
            border: 2px solid rgba(255,224,120,0.5);
            position: relative; z-index: 10; backdrop-filter: blur(12px);
        }

        .logo-text { font-family: 'Fredoka', sans-serif; font-size: 42px; color: #e8822a; margin: 0; }
        .sub-text { font-size: 11px; color: #c96a1a; font-weight: 600; letter-spacing: 3px; margin-bottom: 30px; }

        input {
            width: 100%; padding: 16px; margin: 8px 0;
            border: 2px solid #fde68a; border-radius: 20px;
            font-family: 'Fredoka'; font-size: 16px; outline: none; background: white;
        }

        .btn {
            width: 100%; padding: 18px; margin-top: 15px;
            background: linear-gradient(135deg, #ffd54f 0%, #f48fb1 100%);
            color: white; border: none; border-radius: 25px;
            font-family: 'Fredoka'; font-weight: 600; cursor: pointer;
            box-shadow: 0 8px 20px rgba(244,143,177,0.3);
        }

        /* --- Ticket Container --- */
        #ticket-container { display: none; width: 100%; max-width: 450px; z-index: 10; animation: fadeIn 0.8s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .success-msg {
            background: #f0fdf4; color: #166534; padding: 12px; border-radius: 15px;
            margin-bottom: 20px; font-size: 14px; font-weight: 600; text-align: center; border: 1px solid #bbf7d0;
        }

        #capture-area { border-radius: 35px; overflow: hidden; position: relative; }

        .ticket {
            width: 100%; min-height: 620px; position: relative;
            background: var(--m-bg); display: flex; flex-direction: column;
        }

        .member-img {
            position: absolute; inset: 0;
            background-size: cover; background-position: center 15%; z-index: 1;
        }

        .badge-sticker {
            position: absolute; top: 30px; right: 30px;
            width: 90px; height: 90px; background: #72c95e; color: white;
            border-radius: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Fredoka'; font-weight: 600; font-size: 11px;
            border: 4px dashed rgba(255,255,255,0.4);
            transform: rotate(15deg) scale(0); transition: 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .badge-sticker.pop { transform: rotate(15deg) scale(1); }

        .fade-overlay {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(to top, var(--m-bg) 0%, var(--m-bg) 40%, transparent 80%);
        }

        .ticket-content { position: relative; z-index: 5; margin-top: auto; padding: 40px; }

        .member-badge {
            background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 50px;
            font-size: 12px; font-weight: 600; color: var(--m-color);
            display: inline-block; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.5);
        }

        .detail-label { font-size: 10px; text-transform: uppercase; color: #d4860f; letter-spacing: 1.5px; font-weight: 600; }
        .detail-value { font-size: 15px; font-weight: 600; color: #7a4020; margin-bottom: 15px; }
        #display-name { font-size: 38px; font-weight: 800; font-family: 'Fredoka'; color: #7a4020; margin: 0; line-height: 1; }

        .dl-btn {
            width: 100%; padding: 20px; background: #e8822a; color: white;
            border: none; border-radius: 25px; font-family: 'Fredoka';
            font-weight: 600; margin-top: 25px; cursor: pointer; font-size: 16px;
        }
    </style>
</head>
<body>

<canvas id="daisy-canvas"></canvas>

<div id="form-container" class="card">
    <div class="logo-text">PLLIcnic 🧺</div>
    <div class="sub-text">ANNIVERSARY EVENT</div>
    <input type="text" id="firstName" placeholder="First Name">
    <input type="text" id="lastName" placeholder="Last Name">
    <button class="btn" id="regBtn" onclick="register()">Join the Picnic 🎟️</button>
</div>

<div id="ticket-container">
    <div class="success-msg">✨ Registration Confirmed! ✨</div>
    <div id="capture-area">
        <div id="ticket-body" class="ticket">
            <div id="badge" class="badge-sticker"><span>PLLI</span><b>Certified</b></div>
            <div id="member-photo" class="member-img"></div>
            <div class="fade-overlay"></div>
            <div class="ticket-content">
                <div id="member-tag" class="member-badge">✦ MEMBER</div>
                <div style="font-family: 'Montserrat'; font-size: 24px; color: #7a4020; margin-bottom: 20px; font-weight: 800;">PICNIC PASS</div>
                <div style="display: flex; gap: 50px;">
                    <div><div class="detail-label">Pass ID</div><div id="ticket-id" class="detail-value">---</div></div>
                    <div><div class="detail-label">Date</div><div class="detail-value">June 20, 2026</div></div>
                </div>
                <div style="border-top: 2px solid rgba(249,168,37,0.2); padding-top: 20px;">
                    <div class="detail-label">Authorized PLLI</div>
                    <h1 id="display-name">---</h1>
                </div>
            </div>
        </div>
    </div>
    <button class="dl-btn" onclick="downloadTicket()">Download High-Res Pass 📸</button>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfFoSMdou6RTF1yoTpnAwWA54QY6CkVMaodbKgcKzDC9sos6shLKUm0O3EzFg45Kv5/exec';

    // Member visuals - using high quality placeholders (replace with your real hosted URLs)
    const memberData = {
        "Yejun": { bg: "#c2e0f9", color: "#1f618d", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000" },
        "Noah":  { bg: "#e6cef7", color: "#6c3483", img: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000" },
        "Bamby": { bg: "#ffdde6", color: "#b02c61", img: "https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1000" },
        "Eunho": { bg: "#ffdad6", color: "#b72a27", img: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1000" },
        "Hamin": { bg: "#d9f2d1", color: "#236026", img: "https://images.unsplash.com/photo-1508615039623-a25605d2b022?q=80&w=1000" },
        "PLAVE (Group)": { bg: "#fff3d6", color: "#e8799e", img: "https://images.unsplash.com/photo-1557683311-eac922347aa1?q=80&w=1000" }
    };

    async function register() {
        const first = document.getElementById('firstName').value.trim();
        const last = document.getElementById('lastName').value.trim();
        if(!first || !last) return alert("Please enter both names! ♡");

        const btn = document.getElementById('regBtn');
        btn.innerText = "Checking List... 🌼"; btn.disabled = true;

        try {
            const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ first, last })
            });
            const result = await response.json();
            showTicket(first, result.member, result.passId);
        } catch (e) {
            console.error(e);
            alert("Taking a bit long... showing preview pass!");
            showTicket(first, "PLAVE (Group)", "PLLI-LOCAL");
        }
    }

    function showTicket(name, member, id) {
        const data = memberData[member] || memberData["PLAVE (Group)"];
        const ticket = document.getElementById('ticket-body');
        
        ticket.style.setProperty('--m-bg', data.bg);
        document.getElementById('member-photo').style.backgroundImage = `url(${data.img})`;
        document.getElementById('member-tag').innerText = `✦ ${member.toUpperCase()}`;
        document.getElementById('member-tag').style.color = data.color;
        document.getElementById('display-name').innerText = name.toUpperCase();
        document.getElementById('ticket-id').innerText = id;

        document.getElementById('form-container').style.display = 'none';
        document.getElementById('ticket-container').style.display = 'block';

        setTimeout(() => { document.getElementById('badge').classList.add('pop'); }, 600);
    }

    function downloadTicket() {
        html2canvas(document.querySelector("#capture-area"), { 
            useCORS: true, 
            scale: 2,
            backgroundColor: null 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `PLLIcnic_Pass_${document.getElementById('firstName').value}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    // --- Daisy Animation ---
    const canvas = document.getElementById('daisy-canvas');
    const ctx = canvas.getContext('2d');
    let daisies = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    class Daisy {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = 5 + Math.random() * 8;
            this.speed = 0.5 + Math.random();
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height) { this.y = -20; this.x = Math.random() * canvas.width; }
        }
        draw() {
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size/2, 0, Math.PI*2); ctx.fill();
        }
    }
    for(let i=0; i<30; i++) daisies.push(new Daisy());
    function animate() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        daisies.forEach(d => { d.update(); d.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
